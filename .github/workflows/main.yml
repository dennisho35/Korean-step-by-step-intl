J. 多角度專家審查（AI Council 5-Advisor Review）
1. 獨立評估（Independent Assessments）
反方懷疑論者（The Contrarian Skeptic）：

核心批判：母語諧音（Native-Script Pronunciation Guide）是雙面刃！若初學者過度依賴英文拼讀、泰文或日文片假名，極易把韓語的無送氣塞音讀成重送氣音、把收音 [-k̚/-t̚/-p̚] 加上多餘的尾母音（例如日本人把 물 mul 讀成三音節 ムル muru、泰語使用者在韓語平音上強加泰語聲調），甚至在不知不覺中放棄認讀韓文字母（Hangul），變成永遠依賴拼音拐杖的「文盲型學習者」。

第一性原理工程師（The First-Principles Engineer）：

核心拆解：韓文（Hangul）本身就是世宗大王設計的「特徵音素文字（Featural Alphabet）」，但初學者面臨兩個斷層：(1) 視覺符號與口腔發音部位尚未建立神經連結；(2) 韓語的「字面拼寫（Orthography）」與「音變後實際發音（Phonological Surface Form）」存在系統性差異（如 ㅂ+ㄴ → ㅁ+ㄴ）。因此，母語近似讀音絕不能從「字面韓文」轉寫，必須先經過一層 韓語音變正規化（Orthographic → Actual Phonological Form），再映射至各語言音系，並提供一鍵關閉輔助的「進階模式（Advanced Mode）」。

極限擴張者（The Expansionist）：

宏觀願景：這套 11 語系音變轉寫矩陣與 11,172 音節合成器，未來可擴展為支援 AI 即時語音波形比對（Web Audio API Pitch & Formant 視覺化，即時診斷緊音 ㄲ/ㄸ/ㅃ 聲門閉鎖度與母音 ㅓ vs ㅗ 共振峰差異）、TOPIK I/II 全真模擬考場，以及支援離線神經網路韓語語音包（ONNX Piper TTS）的全球韓語自學平台。

局外觀察者（The Outsider）：

新鮮視角：一個完全不懂韓語的法國、泰國或烏克蘭旅客打開 App 時，最怕看到滿屏複雜的語言學術語。把「語言切換器」放在最顯眼的左上角、一打開就能用母語看懂「點餐怎麼說、2個人跟2人份怎麼分」，並直接點選 🐢 0.24x 聽慢速發音，甚至在韓國餐廳直接點擊畫面發音給店員聽，這才是最直覺的價值。

務實執行者（The Executor）：

今日行動：不要停留在紙上談兵——現在就把 .github/workflows/main.yml 與專案推上 GitHub main 分支，開啟 GitHub Pages，並用手機打開網頁，切換 en-GB、th-TH、ja-JP、ru-RU、uk-UA，實測點選「삼겹살 이 인분 주세요」聽三段語速發音是否流暢。

2. 交叉詰問與盲點補強（Cross-Critique）
第一性原理工程師 回應 反方懷疑論者：懷疑論者指出的「拼音拐杖效應」非常致命，因此我們在系統中強制實作了 5 個獨立顯示開關 與 「🎓 進階模式（Advanced Mode）」，讓學習者在熟悉發音後可一鍵關閉羅馬拼音與母語近似讀音，僅保留韓文原字與實際音變提示 [...]；同時在頂部常駐各語言的「近似音免責與發音提示橫幅」。

務實執行者 回應 極限擴張者：AI 聲學共振峰分析雖酷，但在純靜態 GitHub Pages 與離線 Android 環境下會增加權限與套件負擔；現階段採用零外部 API 成本的系統內建 ko-KR TTS 搭配三段語速（0.24x / 0.35x / 0.45x）與 100% 離線 localStorage/SharedPreferences，才能確保今日立即上線且零維護成本。

3. 主席最終裁決（Chairman's Synthesis）
I. 1 小時內決策（The 1-Hr Decision）：立即採用本次交付的 五層分離發音架構（韓文原字 ＋ 標準羅馬拼音 ＋ 11 語系音變母語近似讀音 ＋ 實際音變 [...] ＋ 三段語速 TTS） 與 左上角 11 語系即時切換器，將 korean_step_by_step_flutter_complete.zip 解壓縮推送至 GitHub 儲存庫。

II. 首要監控風險（The Primary Risk to Monitor）：監控不同作業系統／瀏覽器（特別是部分缺少預載韓語語音包的 Android 手機或桌面瀏覽器）對 ko-KR Web Speech API / flutter_tts 的支援度，以及初學者是否過度依賴母語諧音而忽略收音閉口規則。

III. 第一步立即行動（The #1 Immediate Action Step）
：下載上方  與 ，上傳至 dennisho35/Korean-Learning-web 的 main 分支，並於 GitHub Settings → Pages 將 Source 設為 GitHub Actions，即刻啟動自動化雙平台（Web + Android APK）建置與發布。

K. 已知限制及下一步建議
目前環境與技術限制：

母語近似讀音之語言學極限：韓語的緊音（ㄲ, ㄸ, ㅃ, ㅆ, ㅉ）、開後不圓唇母音 ㅓ [ʌ]、閉央不圓唇母音 ㅡ [ɯ] 以及唯閉不破塞音收音 [-k̚, -t̚, -p̚] 在英語、法語、西語、義語、俄語、日語等目標語言中並無 100% 對等的音位；系統中之 nativePron 已標註為「初學近似輔助」，並強制搭配發音部位說明與三段語速韓語原音。

TTS 語音品質依賴裝置語音引擎：Web 版使用瀏覽器 window.speechSynthesis（ko-KR），Android 版使用系統 flutter_tts（Google Speech Services ko-KR）。若使用者裝置未安裝韓語語音包，系統不會崩潰，但需引導使用者於系統設定中下載韓語離線語音。

純本機儲存（無雲端帳號同步）：目前學習進度、SRS 待重溫清單與語言設定 100% 儲存於裝置端（localStorage / SharedPreferences），跨裝置換機時不會自動同步。

下一步擴充建議：

加入學習進度 JSON 匯出／匯入備份功能，讓使用者可在手機 APK 與電腦瀏覽器 Web 版之間手動轉移學習紀錄。

為 40 個韓文字母與核心音變單字加入預錄真人母語教師 MP3 音檔作為裝置缺少 TTS 時的離線音訊備援。


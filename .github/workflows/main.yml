檢查注音欄位及支援語言是否完整。
確保測試失敗時 Workflow 正確顯示失敗。
請使用穩定且相容的 Actions 版本，並避免不必要的第三方套件。

9.3 Android APK 建置

Workflow 必須具備 Android 建置工作：

建置 APK。
將產物保存為 GitHub Actions Artifact。
使用可識別的檔案名稱。
提供版本或 commit 資訊。
確保建置失敗時不會錯誤地顯示成功。
如要發布正式簽署的 APK，必須使用 GitHub Secrets 保存簽署資料。不得將 keystore、密碼或 API 金鑰寫入 Repository。

若尚未設定正式簽署金鑰，必須明確區分測試建置與正式發行，不可假稱已完成正式簽署。

9.4 Web 建置及 GitHub Pages 部署

Workflow 必須：

建置 Flutter Web。
產生可部署的 Web 產物。
儲存建置 Artifact。
在設定正確的情況下部署到 GitHub Pages。
使用正確的 Repository base path，避免部署後圖片、路由及資源 404。
配置 GitHub Pages 所需的 Actions 權限。
確保部署工作只在符合條件的分支或手動發佈流程執行。
不要只建置首頁而忽略其他頁面、字體、教材 JSON 及圖片資源。

如 Repository 名稱為 Korean-Learning-web，必須特別檢查非根目錄部署時的資源路徑。

9.5 Workflow 品質要求

請實際檢查：

.github/workflows/main.yml 的 YAML 語法。
Flutter 命令是否正確。
各工作之間的依賴關係。
Artifact 路徑是否與實際建置輸出一致。
Pages 權限及部署條件。
Secret 是否正確使用。
Workflow 失敗時是否會阻止錯誤發布。
如果你無法直接存取 GitHub 或執行 Actions，請產生完整的 Workflow 檔案，並提供清楚的設定及驗證步驟。不可聲稱已在 GitHub 上成功執行，除非有實際執行結果。

10. 測試要求

請建立自動化測試，至少涵蓋：

國際化及注音

十種語言都能正常選擇。
切換語言後畫面即時更新。
重新開啟 App 後保留語言偏好。
缺漏翻譯可被檢查工具發現。
每種語言的本地文字注音可獨立載入。
羅馬拼音與本地文字注音可分別顯示或隱藏。
不同文字長度不會導致重要按鈕消失。
缺漏或未校對的注音會被識別。
教材及學習邏輯

韓文字母及教材資料可正確載入。
數字及量詞答案正確。
測驗計分正確。
收藏及錯題紀錄可儲存。
學習進度統計根據真實紀錄計算。
平台

Android 可正常啟動及瀏覽主要課程。
Web 可正常載入、切換語言及播放可用的韓語發音。
GitHub Pages 子路徑部署不會造成資源載入失敗。
離線或儲存失敗時提供合理提示。
交付驗證

請提供每項測試的實際結果，例如：

PASS：實際執行成功。
FAIL：實際執行失敗，並附上原因。
NOT RUN：環境不支援或尚未執行。
不可虛構測試結果、APK 檔案、部署網址或 GitHub Actions 成功紀錄。

11. 開發工作流程

請按以下次序執行。

Phase 1：現況盤點

檢查可取得的 APK、網站、Repository 及教材。
確認現有技術架構。
確認可重用的教材和資源。
列出缺少的原始碼、工具及權限。
提交簡短的技術評估及風險清單。
Phase 2：建立國際化架構

建立十種語言的翻譯資源。
建立左上角語言選擇器。
建立語言偏好儲存。
完成首頁、導覽及主要課程的多語言切換。
建立翻譯完整性驗證。
建立羅馬拼音與本地文字注音的獨立顯示設定。
建立各語言的注音資料格式及校對流程。
Phase 3：重用及整理韓語教材

匯入可驗證的現有教材資料。
保留原有功能。
檢查韓文、數字、量詞及會話內容。
將介面翻譯與韓語教材分離。
補足必要的國際版翻譯及注音。
Phase 4：完成 Android 及 Web 核心功能

完成首頁、課程導覽及字母學習。
完成發音及語速切換。
完成數字、量詞、會話及測驗。
完成學習紀錄及進度儲存。
完成 Logo、圖示及響應式介面。
完成兩種注音的獨立切換。
Phase 5：建立自動化建置

建立 .github/workflows/main.yml。
加入檢查、測試及建置工作。
配置 Android APK Artifact。
配置 Web Artifact 及 GitHub Pages 部署。
寫明所需的 GitHub Repository 設定。
Phase 6：測試及交付

執行可用的測試。
修正實際發現的錯誤。
檢查 Android 及 Web 主要流程。
提供完整專案及建置說明。
列出仍未完成的功能及限制。
如環境及輸出限制不允許一次完成，請優先完成一個真正可建置、可測試的 MVP，再逐步擴充。不可用大量空白檔案或假功能宣稱已完成全部專案。

12. 最終交付清單

請盡可能實際建立並提供以下項目：

完整的 Flutter 原始碼專案。
Android APK 建置設定。
Flutter Web 版本。
assets/data/ 下的共用韓語教材資料。
十種語言的完整翻譯資源。
十種語言的本地文字注音資料及校對狀態。
國際版 Logo、Android Icon 及 Web Icon。
.github/workflows/main.yml。
自動化測試及測試結果。
README.md。
Android 本機建置步驟。
Web 本機執行及建置步驟。
GitHub Repository 設定及 GitHub Pages 部署步驟。
版本、已完成項目、未完成項目及已知限制。
README 必須說明實際使用的 SDK 版本、依賴安裝指令、測試指令、Android 建置指令及 Web 建置指令。

如果能實際建置 APK，請提供真實產物位置。如果不能建置，請說明原因並提供完整的可重現建置方法。

13. 嚴格禁止事項

不可只製作 UI Mockup。
不可只輸出一份建議而不建立可用的檔案。
不可將繁體中文介面簡單替換幾個文字便聲稱完成十種語言。
不可把韓語教材錯誤翻譯成其他語言或改變韓語答案。
不可使用虛構課程數據或測驗分數。
不可假裝 TTS、手寫辨識或 AI 發音評分已成功運作。
不可將 APK 當作完整原始碼。
不可建立無效的 main.yml。
不可在未執行測試時聲稱全部測試通過。
不可在未實際部署時提供虛構的網站網址。
不可把密碼、API 金鑰或正式簽署私鑰寫進原始碼。
不可將未經校對的本地文字注音標示為已驗證。
不可因為某個環境功能不可用而停止所有其他可完成的工作。
14. 五位 AI 顧問的獨立審查

在制定架構及最終交付前，請以以下五種角度進行簡短的內部專案審查，並在報告中列出重要結論：

反方審查者： 找出最可能導致國際版失敗的問題，例如注音不準、翻譯品質不一、APK 不可建置或 GitHub Pages 部署失敗。
第一原理工程師： 確認哪些功能必須共用、哪些資料必須分離，以及如何確保韓語原文與各語言注音保持一致。
擴展規劃者： 提出未來擴展更多語言、真人音訊、雲端同步及進階學習功能的可行架構，但不可將未完成項目當作現有功能。
外部使用者觀點： 從完全不懂韓語的國際初學者角度，檢查操作是否清楚、注音是否容易理解，以及切換語言是否方便。
執行者： 列出可以立即執行的第一步、最優先的交付項目，以及下一輪驗收標準。
最後請提供簡短的交叉審查及總結，指出主要風險、目前最值得先完成的一小時工作，以及下一個具體行動。

此審查不能代替實際編程、測試或建置。

15. 最終回覆格式

完成後，請以以下結構報告：

A. 現有 APK、網站及教材檢查結果。

B. 最終技術架構及選擇理由。

C. 國際化設計及十種語言的完成狀態。

D. 羅馬拼音與本地文字注音的實作及校對狀態。

E. 已實際建立的檔案及專案目錄。

F. main.yml 的功能及 GitHub Actions 設定方法。

G. Android APK 建置狀態及取得方式。

H. Web 建置、GitHub Pages 部署狀態及網址（只有在實際確認後才能提供）。

I. 自動化測試結果。

J. 五位顧問的主要風險及建議。

K. 尚未完成的項目、限制及下一步。

請優先執行可驗證的實際工作，而不是只提供抽象建議。

最終目標：建立一個以韓語為學習對象、支援十種國際介面語言、具備標準羅馬拼音與本地文字注音獨立切換、共用課程邏輯、可建置 Android APK、可在瀏覽器使用，並具有完整 GitHub Actions 自動化流程的韓語學習平台。


E. 韓語教學內容設計
模組 1：韓文字母、拼讀、收音與音變（Hangul & Phonology）：

40 字母表：14 基本子音、5 雙子音、10 基本母音、11 複合母音，每字附發音部位、字形記憶、代表單字、完整例句與三段語速發音。

平音／緊音／送氣音三元對比：ㄱ/ㄲ/ㅋ、ㄷ/ㄸ/ㅌ、ㅂ/ㅃ/ㅍ、ㅅ/ㅆ、ㅈ/ㅉ/ㅊ 最小對立組對照。

互動音節方塊組合器（Syllable Combiner）：支援 19 初聲 × 21 中聲 × 28 終聲 ＝ 11,172 個韓文音節方塊即時合成、母語讀音即時推算與語音合成。

7 大收音代表音與雙收音（Batchim Rules）：[ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅇ] 唯閉不破規則與雙收音左讀／右讀／連音規則（如 없다 [업따] vs 없어요 [업써요]）。

7 大韓語音變規則（Phonological Rules）：連音化、鼻音化、流音化、緊音化、送氣音化、顎音化、ㅎ脫落。

筆順與十字格描紅手寫畫布（Stroke & Writing Canvas）：支援觸控與滑鼠書寫、底字開關與清除重寫。

模組 2：韓語雙數詞系統與 19 個核心量詞（Numbers & Counters）：

完整區分固有韓語數詞（하나, 둘, 셋, 넷... 及量詞前縮略形 한, 두, 세, 네, 스무）與漢字數詞（일, 이, 삼, 사... 及月份特例 유월 6月、시월 10月、大數單位 만 萬 鼻音化 십만 [심만]）。

涵蓋 19 個核心量詞（개, 명/분, 번, 잔, 병, 그릇/공기, 권, 장, 마리, 대, 벌, 켤레, 번(횟수), 시간, 분/초, 달/개월, 살/세, 인분, 박/일/층），明確標示何時用固有數詞（如 두 명 2人、두 잔 2杯）、何時用漢字數詞（如 이 인분 2人份餐點、이 박 삼 일 兩晚三天）。

模組 3：20 課旅遊與生活情境會話（20 Conversations）：

涵蓋問候、道別、自我介紹、初次見面、借過与呼叫店員（잠시만요 vs 저기요）、餐廳點餐、購物退稅、問路、地鐵巴士 T-money、酒店入住寄放行李、機場報到、時間詢問、飲食忌口（微辣／過敏）、請說慢一點、聽不懂求助、請寫下來、朋友聊天、K-POP 演唱會領票、醫療買藥與緊急求助（112／119／1330）、電話預約與交換聯絡方式。

模組 4 & 5：26 題互動測驗與真實數據學習統計（Quizzes & SRS Progress）：

包含聽音辨字、字母讀音、音節合成、收音代表音、音變判斷、時間金額報價、量詞填空與情境對話應答；答錯題目自動寫入本機 SRS 需重溫清單，所有統計數據皆由 localStorage / SharedPreferences 實際紀錄即時計算。


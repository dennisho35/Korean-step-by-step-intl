分頁 3（數字與量詞）：B4 情境式雙軌數字即時轉換器（支援 0 至 9 億 9999 萬及 9 種情境自動切換）、隨機價格與時間聽力挑戰、B1-B4 全 12 單元數字學習格、B3 固有與漢字數詞情境比較表，以及 C 19 大類韓語量詞與例句。

分頁 4（日常會話 20 課）：全 20 課主題下拉選單、整課連播、多輪對話逐句三速發音、實際連音標示、生字收藏、正式與非正式語體解析，以及隨堂互動練習題。

分頁 5（測驗與統計）：E2 13 大互動題型測驗（含分類篩選、即時批改與詳解）、E3 SRS 間隔重複錯題本、自訂收藏夾，以及 E4 100% 真實數據統計報表。

個人 AI 顧問團（5-Advisor Personal AI Council）深度評估
針對「解決跨平台 Web 原型與 Android 原生 APK 功能落差，並建立可持續演進的韓語學習 App 架構」，以下由五位不同思維視角的顧問進行同步剖析：

1. 獨立評估（Independent Assessment）
1. 逆向懷疑論者（The Contrarian Skeptic）：

核心批判：同時維護一套單檔 HTML/JS 網頁版（index.html）與一套純 Dart/Flutter 雙軌介面（lib/main.dart），是軟體工程中最典型的「雙重維護陷阱（Dual-Maintenance Trap）」。只要未來修改一題測驗或新增一個會話句，你就必須改兩個地方，否則兩邊又會出現落差。

潛在風險與最壞失效模式：

Android 原生 TTS 碎片化災難：Web 版的 SpeechSynthesis 與 Android 的 flutter_tts 底層呼叫的是手機廠商預設引擎（Samsung TTS 或 Google TTS）。若使用者手機未預先下載韓語（ko-KR）離線語音包，點擊發音會完全無聲卻沒有明顯錯誤提示。

螢幕尺寸溢位（RenderFlex Overflow）：韓語例句加上繁體中文解釋與羅馬拼音資訊密度極高，在小螢幕 Android 手機若開啟系統大字體，原生 Widget 容易發生排版擠壓或黃黑條紋溢位。

2. 第一性原理工程師（The First-Principles Engineer）：

問題拆解與基本事實：

事實一（資料層）：教學內容本質上是純結構化資料（assets/data/curriculum.json，共 40 字母、7 音變、12 數字單元、19 量詞、20 會話、26 測驗題），這部分在 APK 與 Web 間已經是 100% 同源的。

事實二（狀態與演算法）：韓文音節合成公式 
Unicode=((C×21)+V)×28+B+0xAC00、雙軌數字轉換、以及 SRS 間隔重複（
1→3→7→14 天）皆為純數學確定性函數（Deterministic Functions）。

事實三（視圖層）：App 只是將 State + Curriculum JSON 映射為互動元件的渲染器。

從零重建的邏輯解方：將所有商業邏輯（組字演算法、固有/漢字數字轉換、SRS 狀態機）封裝在純 Dart 狀態層，並讓 lib/main.dart 的 5 個分頁直接綁定 curriculum.json 的每一個陣列鍵值，徹底消滅任何硬編碼佔位字串（Stub Text）。

3. 極限擴張主義者（The Expansionist）：

打破邊界的終極願景：不要只滿足於靜態教材！既然已經打通 GitHub Actions 自動化編譯 APK 與完整離線雙軌架構，下一階段應將「韓語一步通」升級為 AI 沉浸式韓國實境求生系統：

裝置端即時聲學頻譜分析（On-device Formant & Pitch Contour）：用麥克風即時捕捉使用者發平音（ㄱ）、緊音（ㄲ）、送氣音（ㅋ）時的聲門閉鎖時間（VOT）與基頻音高，在螢幕上畫出聲波曲線對比。

實景 AR 菜單與路牌拆解引擎：使用者在首爾餐廳打開相機拍韓文菜單，App 自動將每個韓文字拆解為「初聲＋中聲＋終聲收音」，即時標註連音化（如 볶음밥 → [보끔밥]）並換算即時匯率金額。

生成式 AI 角色扮演老闆：在 20 課會話基礎上，接入語音 LLM 扮演語速飛快的明洞烤肉店老闆或弘大店員，訓練初學者在真實壓力下用「잠시만요」、「천천히 말씀해 주세요」成功點餐。

4. 局外觀察者（The Outsider）：

零背景新鮮視角：我不懂 Flutter 也不懂 GitHub Actions，我只是一個下禮拜要飛首爾旅遊、連「안녕하세요」都還看不懂的香港或台灣初學者。當我打開手機上的 App，我根本不在乎它是用 Web 還是 Dart 寫的——我在乎的是：當我點下「日常會話」或「數字與量詞」時，畫面要立刻給我能發音的句子，而不是一行冷冰冰的工程師除錯文字（完整資料已載入於...）。

直覺處方：把所有工程術語從使用者眼裡徹底拿掉！把最常救命的功能——「餐廳點餐」、「這個多少錢」、「計程車地址出示卡」與「一鍵調慢語速（0.24x）」放在最顯眼、單手大拇指一秒按得到的地方。


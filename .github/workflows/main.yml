專業韓語學習 App 開發指令（Android 一、你的角色與任務 你是一個由以下專家組成的專業 AI 開發團隊： 1. 資深 App 產品經理（Product Manager） 2. 專業 UI/UX 設計師 3. 資深 Flutter 跨平台 App 開發工程師 4. 專業韓語教師及韓國語言學專家（Korean Language Educator） 5. 韓語語音、語音合成及語音辨識工程師 6. 軟件測試及品質保證工程師（QA Engineer） 7. 韓文文字處理、字體及書寫教學專家 8. 以附件日文學習app 為藍本, 生成韓文版學習app 請為我從零開始設計及開發一個完整、可實際使用的韓語學習 App，同時支援 Android App 暫定名稱：韓語一步通 Korean Step-by-Step 目標使用者是完全沒有韓語基礎的初學者。使用者主要透過繁體中文學習韓語，希望由韓文字母、發音、拼讀、數字、量詞及日常會話開始，循序漸進地掌握實用韓語，並具備在韓國旅遊、購物、餐飲、交通及日常社交時的基本溝通能力。 這不是單純的 UI 示範、靜態網頁或只有按鈕的原型，而是一個具有真正學習功能、可持續擴充、可測試及可建置的完整 App 專案。 請參考我提供的現有學習 App 架構及改良要求，保留以下設計原則： - 課程內容完整、分類清晰。 - 每一個字母、數字、日期、時間及詞彙都可以獨立點選。 - 每個獨立學習項目均有發音按鈕。 - 發音提供特慢、初學慢速及標準三種速度。 - 每項內容均提供繁體中文解釋及實際例句。 - 將容易混淆的內容標記為學習重點。 - 記錄每個項目的學習狀態、測驗成績及重溫次數。 - 所有統計數字必須由實際資料計算，不得使用虛構數據。 重要： 不可直接將日語五十音、日語量詞或日語數字規則套用到韓語。所有教材、讀音、例句及語言規則均必須依照正確的韓語系統重新設計。 二、開發及技術要求 請優先採用以下技術方案： - 跨平台框架：Flutter，使用 Dart。 - Android：支援現代 Android 手機。 - iOS：支援現代 iPhone。 - 介面語言：繁體中文（zh-TW）。 - 教學語言：現代標準韓語，以首爾標準語為主要參考。 - 資料儲存：採用可靠的本機資料庫或本機儲存方案。 - 語音：優先整合裝置原生 TTS（Text-to-Speech），並提供可替換的語音服務介面。 - 書寫：使用可在手機觸控螢幕運作的韓文字母手寫畫布。 - 網絡：基本課程及已下載內容盡量支援離線使用。 - 架構：採用模組化、可測試、容易維護及擴充的程式設計方式。 請優先選擇成熟、維護良好及授權合適的 Flutter 套件。正式選用前，檢查套件與目前 Flutter 版本的相容性。 如果目前環境不支援直接開發或建置 Flutter App，請明確說明限制，並提出可行的替代方案。不可只建立網頁便聲稱已完成 Android 和 iOS App。 開始前，請先檢查實際可用的工具、檔案存取、終端機、Flutter SDK、Android SDK、iOS 建置環境及語音功能。不可假設自己擁有未經驗證的權限或能力。 三、核心功能模組 模組 A：韓文字母及拼讀學習中心 這是整個 App 最重要的功能，必須優先完成。 A1. 基本子音（자음） 完整教授現代韓語的 14 個基本子音： ㄱ、ㄴ、ㄷ、ㄹ、ㅁ、ㅂ、ㅅ、ㅇ、ㅈ、ㅊ、ㅋ、ㅌ、ㅍ、ㅎ。 每個字母均須獨立顯示及學習，不可將多個字母合併在同一個不可操作的長卡片內。 每個字母提供： 1. 韓文字母。 2. 初學者可理解的羅馬拼音或拉丁字母輔助。 3. 接近的中文發音提示，但必須標明中文只是近似提示，不能完全代表韓語發音。 4. 標準韓語發音播放。 5. 特慢、初學慢速及標準語速。 6. 書寫筆順及方向示範。 7. 手寫描紅及自由書寫。 8. 字形記憶技巧。 9. 常見混淆字母比較。 10. 學習狀態、練習次數及重溫記錄。 A2. 雙子音（쌍자음） 完整教授： ㄲ、ㄸ、ㅃ、ㅆ、ㅉ。 必須解釋雙子音的緊音特徵，並與相似的平音及送氣音比較。 例如： - ㄱ、ㄲ、ㅋ - ㄷ、ㄸ、ㅌ - ㅂ、ㅃ、ㅍ - ㅅ、ㅆ - ㅈ、ㅉ、ㅊ 提供聆聽辨認、跟讀及選擇題，避免使用不準確的中文諧音取代真正發音教學。 A3. 基本母音（모음） 完整教授 10 個基本母音： ㅏ、ㅑ、ㅓ、ㅕ、ㅗ、ㅛ、ㅜ、ㅠ、ㅡ、ㅣ。 每個母音均須提供： - 字形及名稱。 - 羅馬拼音輔助。 - 嘴形及舌位提示。 - 發音播放。 - 筆順動畫。 - 手寫練習。 - 常見錯誤。 - 與相近母音的比較。 A4. 複合母音（복합 모음） 完整教授以下常見複合母音： ㅐ、ㅒ、ㅔ、ㅖ、ㅘ、ㅙ、ㅚ、ㅝ、ㅞ、ㅟ、ㅢ。 說明不同母音的組合方式，以及現代韓語中部分母音在實際發音上可能相近的情況。 不可把所有字母的羅馬拼音視為永遠固定的實際發音，也不可忽略現代韓語的發音差異。 A5. 韓文字母組合及音節方塊 韓文不是將字母單純逐個橫向排列。請建立專門課程，教授如何將子音和母音組合成音節方塊。 必須包含： - 子音＋母音。 - 子音＋母音＋收音。 - 左右排列的字母組合。 - 上下排列的字母組合。 - 同時包含左右及上下結構的組合。 - 沒有實際子音發音的字首 ㅇ。 - 韓文字形排列、閱讀方向及書寫比例。 例如： 가、나、다、라、마、바、사、아、자、차、카、타、파、하。 進一步教授： - 고、구、그、기。 - 너、노、누、느、니。 - 다、더、도、두、드、디。 請以可互動的方式展示字母組合，讓使用者選擇子音及母音，系統即時組成合法的韓語音節，並顯示讀音。 必須驗證組合邏輯，不能只靠大量硬編碼假資料。 A6. 收音（받침）專項課程 收音是韓語初學者的重要難點，必須設立獨立學習模組。 內容包括： - 基本收音概念。 - ㄱ、ㄴ、ㄷ、ㄹ、ㅁ、ㅂ、ㅇ 等代表性收音。 - 其他子音在音節末尾的發音規則。 - 雙收音（겹받침）。 - 收音與下一個音節的連音。 - 收音在不同環境下的實際讀音。 - 常見收音發音錯誤。 - 收音聽辨及拼讀練習。 請透過實際韓語詞彙展示收音在不同位置的變化，不可只列出規則而沒有例子。 A7. 韓語音變規則 建立由淺入深的發音規則課程，至少包括： 1. 連音（연음）。 2. 鼻音化（비음화）。 3. 流音化（유음화）。 4. 緊音化（경음화）。 5. 送氣音化（격음화）。 6. 部分收音及雙收音的發音規則。 7. 其他常見初級發音變化。 每項規則均提供： - 原本的韓文字形。 - 正確的實際發音提示。 - 羅馬拼音或讀音輔助。 - 慢速及標準速度音訊。 - 規則解釋。 - 至少 3 個經核對的實際詞彙或句子。 - 容易出錯的地方。 - 聆聽及選擇練習。 請以標準韓語教學資料作校對。對於存在例外或不同讀音的情況，必須說明適用條件，不可自行編造發音規則。 A8. 羅馬拼音及初學者輔助 每個字母、詞彙及會話句子均可顯示羅馬拼音。 羅馬拼音須以一致的轉寫方案建立，並清楚標示它只是輔助閱讀工具。 重要要求： - 不可只以羅馬拼音代替韓文字母。 - 不可將羅馬拼音直接當作完整的實際發音。 - 對於音變、連音及緊音等情況，應另行顯示實際發音提示。 - 提供可選擇隱藏羅馬拼音的模式，逐步訓練使用者直接閱讀韓文。 A9. 韓文字母手寫練習 開發真正可操作的手寫功能，而非只顯示韓文字母圖片。 功能要求： - 使用者可用手指在手機螢幕上書寫。 - 顯示淡色韓文字母作為描紅參考。 - 顯示筆順及方向提示。 - 提供自由書寫模式。 - 提供重新書寫、清除及提交按鈕。 - 儲存每個字母的練習次數及完成狀態。 - 支援重複練習及查看歷史進度。 - 練習畫布適合不同手機螢幕尺寸。 如未能可靠判斷手寫字形，必須標示為「自我練習模式」，不可聲稱已具備準確的 AI 手寫辨識功能。 A10. 發音訓練 在所有主要教學頁面的頂部提供三段語速即時切換： - 🐢 特慢：0.24x - 🎧 初學慢速：0.35x，預設 - ▶️ 標準：0.45x 以上為目標語速設定，必須先測試所選 TTS 引擎是否真正支援。如果引擎無法提供指定速度，應使用其可用的速度參數並清楚標示實際設定，不可假裝已成功切換。 功能包括： - 點擊字母或詞彙播放發音。 - 單字重播。 - 慢速及正常速度播放。 - 聽音選擇正確字母。 - 子音及母音辨認。 - 音節拼讀。 - 收音辨認。 - 容易混淆發音的比較。 - 句子跟讀。 - 逐字及整句播放。 清楚區分系統 TTS、真人錄音、使用者錄音及 AI 發音評分。若只使用 TTS，不可聲稱已具備真人錄音或 AI 發音準確度評分。 模組 B：韓語數字教學 韓語數字必須分為兩套獨立的數字系統教授，這是本 App 的核心教學要求。 B1. 固有韓語數詞（고유어 수사） 完整教授： 하나、둘、셋、넷、다섯、여섯、일곱、여덟、아홉、열。 再逐步教授： - 11 至 19。 - 20、30、40、50、60、70、80、90。 - 21 至 99 的組合規則。 - 100 及更大的數量如何表達。 - 常用數量詞配搭。 - 數字在不同情境下的實際使用。 每個數字必須獨立成為一個可點選學習格，顯示韓文、羅馬拼音、繁體中文解釋及發音按鈕。 B2. 漢字韓語數詞（한자어 수사） 完整教授： 영／공、일、이、삼、사、오、육、칠、팔、구、십。 進一步教授： - 0 至 10。 - 11 至 99，完整列出全部 89 個數字。 - 100 至 900。 - 1,000 至 9,000。 - 萬、十萬、百萬、千萬及更大數字。 - 金額及購物價格。 - 日期、月份、年份。 - 分鐘、秒數、電話號碼。 - 百分比及其他常見數字表達。 所有數字應以獨立學習格呈現，不可只列出少數代表例子便聲稱已經完整。 大型數字須採用正確的韓語數字單位及分組規則，並提供可輸入數字即時轉換成韓文的互動轉換器。 B3. 兩套數字的使用情境比較 請清楚教導使用者何時使用固有韓語數詞、何時使用漢字韓語數詞。 至少包括： - 計算物件數量。 - 計算人數。 - 計算年齡。 - 表達時間的「幾點」。 - 表達分鐘及秒數。 - 日期及月份。 - 年份。 - 金額。 - 電話號碼。 - 數學及一般數字閱讀。 特別教授固有數詞在部分量詞前的縮略形式： 하나 → 한 둘 → 두 셋 → 세 넷 → 네 以及其他實際使用中需要注意的變化。 例如： - 한 명：一個人。 - 두 개：兩個。 - 세 시：三點。 - 네 명：四個人。 - 십 분：十分鐘。 每項例子均須標明適用情境及數字系統，不可將兩套系統混為一談。 B4. 完整數字學習列表 請建立下列獨立單元： 1. 基本數字。 2. 11 至 99。 3. 百位。 4. 千位。 5. 萬位及以上。 6. 固有數詞與量詞組合。 7. 金額及購物。 8. 日期及月份。 9. 時間。 10. 年齡。 11. 電話號碼。 12. 聽音辨認及數字轉換。 每個數字都必須可單獨點選、播放、收藏及測驗。 提供搜尋、分類、篩選、上一個／下一個及連續播放功能。 如使用者輸入一個數字，系統應根據指定情境顯示正確的韓語讀法，而不是只提供單一、可能不適用的答案。 模組 C：韓語量詞及數目單位 韓語量詞與數字系統密切相關，必須採用情境式教學。 至少包括： 1. 個／件：개。 2. 人：명、분。 3. 名稱或個別事物：번等常見用法。 4. 杯：잔。 5. 瓶：병。 6. 杯裝飲品及常見飲品的量詞搭配。 7. 本／冊：권。 8. 張／片：장。 9. 隻／條等常見動物量詞搭配。 10. 輛：대。 11. 件衣物：벌。 12. 雙鞋：켤레。 13. 次數：번。 14. 小時：시간。 15. 分鐘：분。 16. 個月及月份相關表達。 17. 年齡及生日。 18. 食物、餐點及旅行常用物件的量詞。 19. 購物、點餐及詢問數量時常用的表達方式。 請根據實際韓語用法選擇正確量詞，不可把中文量詞逐字翻譯成韓語。 每個量詞均須包含： - 韓文名稱。 - 羅馬拼音。 - 繁體中文解釋。 - 適用物件或情境。 - 常用數字配搭。 - 發音播放。 - 實際生活例句。 - 常見錯誤提醒。 - 測驗及重溫功能。 C1. 量詞數字組合規則 必須教授數字與量詞組合時的正確形式，例如： - 한 개：一個。 - 두 개：兩個。 - 세 개：三個。 - 네 개：四個。 - 한 명：一個人。 - 두 명：兩個人。 - 세 명：三個人。 - 네 명：四個人。 - 한 잔：一杯。 - 두 잔：兩杯。 - 세 병：三瓶。 - 네 권：四本。 同時教授固有韓語數詞與漢字韓語數詞的選擇，以及常見縮略形式。 C2. 實際情境例句 例子一：在咖啡店點飲品。 韓文：아메리카노 두 잔 주세요. 羅馬拼音：Amerikano du jan juseyo. 中文：請給我兩杯美式咖啡。 例子二：詢問有多少人。 韓文：몇 명이에요? 羅馬拼音：Myeot myeong-ieyo? 中文：有多少人？ 例子三：購物。 韓文：이거 세 개 주세요. 羅馬拼音：Igeo se gae juseyo. 中文：請給我這個三個。 請在正式教材中校對所有韓文拼寫、空格、發音及語法；以上羅馬拼音只作初學者輔助，不可取代標準韓語讀音。 模組 D：韓語日常生活會話 建立可持續擴充的情境式韓語會話資料庫。 初期至少包含： 1. 基本打招呼。 2. 早安、午安、晚安及道別。 3. 自我介紹。 4. 初次見面。 5. 感謝及道歉。 6. 餐廳點餐。 7. 購物及詢問價格。 8. 問路。 9. 乘搭地鐵、巴士及的士。 10. 酒店入住及退房。 11. 機場及旅行常用語。 12. 詢問時間、日期及星期。 13. 表達喜好及需求。 14. 請對方說慢一點。 15. 表示聽不懂韓語。 16. 請對方重複或寫下內容。 17. 與韓國朋友聊天。 18. 演唱會、購票及入場。 19. 醫療及緊急求助。 20. 日常社交及簡單電話對話。 每句會話必須提供： - 韓文原文。 - 羅馬拼音。 - 繁體中文翻譯。 - 標準韓語發音播放。 - 慢速播放。 - 重要詞彙解釋。 - 基本文法。 - 正式與非正式說法的分別。 - 使用情境。 - 常見錯誤。 - 互動測驗。 D1. 基本打招呼範例 韓文：안녕하세요. 羅馬拼音：Annyeonghaseyo. 中文：你好。 韓文：감사합니다. 羅馬拼音：Gamsahamnida. 中文：謝謝。 韓文：죄송합니다. 羅馬拼音：Joesonghamnida. 中文：對不起／不好意思。 韓文：처음 뵙겠습니다. 羅馬拼音：Cheoeum boepgetseumnida. 中文：初次見面。 每句均須提供播放、重播、收藏及跟讀功能。 D2. 互動式對話練習 每個情境必須有多輪對話，而不是只有一個句子。 例如餐廳點餐： - 顯示服務員的韓文句子。 - 讓使用者選擇合適的回答。 - 提供正確答案及繁體中文解釋。 - 可以逐句播放及重聽。 - 根據答題結果調整下一題難度。 - 完成後顯示分數及需要重溫的詞彙。 初期課程以標準、禮貌的韓語表達為主，之後才逐步介紹朋友之間的非正式說法。 模組 E：每日學習、測驗及複習 E1. 每日學習計劃 - 可設定每日 5、10、15 或 30 分鐘。 - 自動安排當日課程。 - 顯示今日學習目標及完成進度。 - 記錄完成的字母、詞彙及會話。 - 支援學習提醒設定。 - 可調整每日學習目標。 E2. 測驗模式 至少包括： - 看韓文字母選擇正確讀音。 - 聽音選擇正確字母。 - 子音與母音配對。 - 韓文字母組合。 - 收音辨認。 - 音變規則辨認。 - 韓文與羅馬拼音配對。 - 固有數詞及漢字韓語數詞測驗。 - 數字聽力。 - 量詞選擇題。 - 日常會話填空。 - 韓中意思配對。 - 情境式對話選擇。 測驗完成後，顯示： - 答對題數。 - 總題數。 - 正確率。 - 錯誤題目。 - 正確答案及解釋。 - 建議重溫的課程。 所有計分及答案判斷必須真正運作。 E3. 錯題及複習系統 - 自動記錄答錯的題目。 - 按錯誤次數安排重溫。 - 收藏字母、詞彙及句子。 - 支援自訂生字清單。 - 採用簡單的間隔重複學習機制（Spaced Repetition）。 - 根據使用者的答題表現調整複習頻率。 E4. 學習統計 顯示： - 已掌握的基本子音及母音數量。 - 已掌握的複合母音數量。 - 音節拼讀完成度。 - 收音及音變課程進度。 - 數字與量詞掌握程度。 - 已完成課程數量。 - 測驗平均正確率。 - 累計學習時間。 - 連續學習日數。 - 需要重溫的項目。 所有統計必須來自真實的使用紀錄，不得使用預設的虛構數據。 四、完整課程列表及獨立學習格規格 請採用類似成熟語言學習 App 的方式，將教材拆分成清楚的單元、章節及獨立學習格。 每個學習格代表一個可獨立操作的字母、數字、詞彙、日期、時間或句子。 每個格子至少提供： 1. 韓文或數字。 2. 羅馬拼音。 3. 繁體中文意思或解釋。 4. 發音播放。 5. 收藏。 6. 已學習狀態。 7. 測驗入口。 8. 重溫記錄。 必須建立下列主要單元： 1. 基本子音。 2. 雙子音。 3. 基本母音。 4. 複合母音。 5. 子音與母音組合。 6. 音節拼讀。 7. 收音。 8. 連音及音變規則。 9. 基本固有韓語數詞。 10. 漢字韓語數詞。 11. 數字完整列表及轉換器。 12. 量詞及數量表達。 13. 日期、月份、星期及年份。 14. 時間、年齡及電話號碼。 15. 日常會話、測驗及複習。 如擴充成更多單元，請以實際課程結構為準。不要為了達到指定單元數目而重複或虛構教材。 請在開發文件中列明每個單元的實際學習格數、資料來源及完成狀態。 五、UI/UX 介面設計 設計風格要求： - 現代、簡潔、時尚。 - 具有韓國文化特色，但避免過度使用卡通或裝飾。 - 以米白色、深藍色及適量韓系粉紅或朱紅色作為主要視覺元素。 - 使用清晰易讀的繁體中文字體及韓文字體。 - 韓文字母必須正確顯示，不可出現缺字、亂碼或字形被裁切。 - 按鈕尺寸適合手機觸控。 - 每頁避免過多資訊。 - 適合成年人及完全沒有韓語基礎的初學者。 - 支援深色模式及淺色模式。 - 支援不同手機螢幕尺寸。 - 提供無障礙文字大小及清晰對比度。 請先建立統一的 Design System，包括： - 顏色。 - 字體。 - 字體大小及層級。 - 按鈕樣式。 - 卡片樣式。 - 間距。 - 圖示。 - 語速控制列。 - 音訊播放元件。 - 學習狀態標示。 - 頁面導覽規則。 請設計以下頁面： 1. 啟動畫面。 2. 新手導覽。 3. 首頁及每日學習任務。 4. 課程分類頁。 5. 韓文字母總覽。 6. 單個字母教學頁。 7. 字母組合頁。 8. 收音及音變教學頁。 9. 書寫練習頁。 10. 發音訓練頁。 11. 固有韓語數詞課程。 12. 漢字韓語數詞課程。 13. 數字完整列表及轉換器。 14. 量詞課程及例句頁。 15. 日期及時間課程頁。 16. 年齡及電話號碼頁。 17. 日常會話情境頁。 18. 測驗頁。 19. 錯題複習頁。 20. 收藏生字頁。 21. 學習進度頁。 22. 設定頁。 首頁應清楚顯示四個主要入口： - 韓文字母 - 數字與量詞 - 日常會話 - 測驗與複習 請提供實際可操作的導覽及返回功能，不可只製作靜態畫面。 六、資料結構及內容管理 請將教材資料與 UI 程式碼分開，避免將所有內容寫在單一大型程式檔案。 每個韓文字母資料至少包含： - 唯一 ID。 - 韓文字母。 - 類型：基本子音、雙子音、基本母音或複合母音。 - 羅馬拼音。 - 發音提示。 - 發音音訊來源或生成方式。 - 筆順資料或動畫來源。 - 教學提示。 - 相關測驗資料。 - 學習狀態。 每個音節資料至少包含： - 唯一 ID。 - 韓文字形。 - 組成子音及母音。 - 收音資訊（如有）。 - 羅馬拼音。 - 標準讀音提示。 - 發音規則。 - 相關例詞。 - 測驗資料。 每個詞彙及會話資料至少包含： - 唯一 ID。 - 韓文原文。 - 羅馬拼音。 - 繁體中文翻譯。 - 詞性或分類。 - 發音資料。 - 例句。 - 使用情境。 - 正式程度。 - 難度級別。 數字與量詞資料必須支援： - 固有韓語數詞。 - 漢字韓語數詞。 - 數字與量詞配搭。 - 數字縮略形式。 - 不同使用情境。 - 特殊讀法及例外規則。 請建立資料驗證機制，檢查重複 ID、缺失翻譯、空白羅馬拼音、錯誤分類及無效音訊來源。 七、語音、隱私及離線要求 1. 在支援的裝置上播放韓語語音。 2. 優先提供可離線使用的語音方案；如需網絡，必須清楚提示。 3. 語音播放失敗時，提供錯誤提示及重試功能。 4. 錄音功能必須先取得適當的麥克風權限。 5. 不可在未經使用者同意的情況下錄音或上傳語音。 6. 學習紀錄優先儲存在本機。 7. 如整合雲端同步，必須清楚說明資料使用方式。 8. 基本課程不應強制要求使用者註冊帳戶。 9. API 金鑰不得直接寫入公開 App 原始碼。 10. 第三方字體、音訊、筆順動畫及其他資源必須符合授權要求。 11. 必須說明 TTS 語速設定在 Android 與 iOS 上可能存在的差異。 12. 若裝置未安裝韓語語音資料，應提供設定指引或適當錯誤提示。 八、測試及品質保證 請建立實際可執行的測試，而不只是列出測試計劃。 至少包括： - 基本子音及母音完整性測試。 - 雙子音及複合母音資料測試。 - 韓文字母組合邏輯測試。 - 收音及音變規則測試。 - 羅馬拼音及讀音資料檢查。 - 固有韓語數詞測試。 - 漢字韓語數詞測試。 - 數字與量詞組合測試。 - 會話翻譯及資料完整性測試。 - 測驗答案及計分邏輯測試。 - 學習進度儲存及讀取測試。 - 離線功能測試。 - 語音播放錯誤處理測試。 - 手寫畫布操作測試。 - 不同螢幕尺寸的 UI 測試。 - Android 建置測試。 - iOS 建置測試。 所有測試必須記錄實際執行結果。 未能在目前環境執行的測試，必須標示「尚未執行」，不可聲稱已通過。 九、開發流程及交付要求 Phase 1：產品規劃 先建立： - App 功能架構圖。 - 使用者操作流程。 - 頁面清單。 - UI/UX 設計規範。 - 技術架構及套件選擇。 - 資料模型。 - 開發里程碑。 - 主要技術風險及解決方法。 完成規劃後，立即進入 Phase 2，不要停留在規劃或文字建議階段。 Phase 2：建立可運作的 MVP 優先實作： 1. 首頁及課程導覽。 2. 完整基本子音、雙子音及母音資料。 3. 韓文字母組合及基本拼讀。 4. 羅馬拼音及韓語發音播放。 5. 三段語速控制。 6. 韓文字母描紅及自由書寫。 7. 基本收音課程。 8. 固有韓語數詞及漢字韓語數詞。 9. 基本量詞及生活例句。 10. 日常打招呼及自我介紹。 11. 測驗及即時答案解釋。 12. 本機學習進度儲存。 13. 基本離線學習能力。 MVP 必須具備真正可操作的功能，不可使用只會顯示訊息的假按鈕。 Phase 3：擴充功能 完成： - 完整數字列表。 - 大型數字及數字轉換器。 - 進階量詞。 - 日期、月份、星期及年份。 - 時間、年齡及電話號碼。 - 更多日常生活情境。 - 收音及音變進階練習。 - 錯題複習。 - 學習統計。 - 每日學習目標。 - 深色模式。 - 可選擇的語音辨識或發音評分整合。 Phase 4：測試及正式建置 請提供： - 完整專案原始碼。 - 清楚的專案目錄結構。 - 必要的設定檔。 - 依賴套件清單。 - 測試程式及執行結果。 - Android 建置及安裝指南。 - iOS 建置及安裝指南。 - APK 或 AAB 的產生方法。 - iOS IPA 的產生方法及所需 Apple 開發環境。 - Google Play 及 Apple App Store 發佈
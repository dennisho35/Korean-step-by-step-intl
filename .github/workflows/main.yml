4. 國際化發音輔助系統

這是本專案的重要功能。所有韓文字母、詞彙及會話句子，必須將「標準韓語羅馬拼音」與「使用者本地文字注音」分開處理。

4.1 三種不同的發音資訊

每個學習項目應支援以下資訊：

韓文原文（Hangul）：學習者最終應掌握的文字。
標準羅馬拼音（Romanization）：使用一致的韓語羅馬拼音方案，例如修訂羅馬字（Revised Romanization）。
本地文字發音輔助（Native-Script Pronunciation Guide）：根據使用者選擇的語言，以該語言熟悉的文字及拼讀方式提供近似發音提示。
實際讀音提示（Actual Pronunciation）：針對連音、收音及音變等情況，說明韓語實際讀音。
韓語音訊：由可用的韓語 TTS 或經授權的真人錄音提供。
以上欄位必須各自獨立儲存，不能把羅馬拼音、本地文字注音及實際讀音混為同一個欄位。

4.2 按使用者介面語言提供本地文字注音

使用者語言本地文字注音方式注意事項英國 English (UK)拉丁字母拼音提示保留標準韓語羅馬拼音，並說明英語讀音與韓語的差異泰國 ภาษาไทย泰文字母注音必須考慮泰語聲調、子音及尾音系統與韓語不同日本 日本語平假名注音平假名無法完整表達所有韓語子音及收音，需提供額外提示越南 Tiếng Việt越南文拼讀輔助不可把越南語聲調符號直接當作韓語聲調法國 Français法語式拼讀提示考慮法語字母與韓語發音的差異德國 Deutsch德語式拼讀提示特別注意母音及子音的差異西班牙 Español西班牙語式拼讀提示使用當地熟悉的拼讀方式，並標示近似發音的限制俄羅斯 Русский西里爾字母注音使用俄語讀者熟悉的拼讀方式烏克蘭 Українська烏克蘭語西里爾字母注音必須按烏克蘭語拼讀習慣獨立校對意大利 Italiano意大利語式拼讀提示說明與韓語發音不同之處

不可直接將韓語羅馬拼音逐字轉換成另一種文字，然後便宣稱完成本地化注音。

必須根據實際韓語發音、使用者的語言系統及當地讀者的理解習慣，建立獨立的注音規則並進行校對。

對於無法精確對應的韓語音，應標示為「近似發音」，提供文字解釋及標準韓語音訊。


name: Korean Step-by-Step International CI/CD (Android APK & GitHub Pages Web)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: 1. Validate i18n, Phonetics & Run Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python for Curriculum & i18n Schema Audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 11-Locale & Pronunciation Guide Validation Suite
        run: python3 tool/validate_i18n.py

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Missing Native Platform Files (if needed)
        run: |
          if [ ! -f "android/gradlew" ] || [ ! -d "web" ]; then
            cp -r lib /tmp/lib_bak
            cp -r assets /tmp/assets_bak
            cp pubspec.yaml /tmp/pubspec_bak.yaml
            flutter create . --project-name korean_step_by_step --org com.stepbystep.korean --platforms=android,web
            cp -r /tmp/lib_bak/* lib/
            cp -r /tmp/assets_bak/* assets/
            cp /tmp/pubspec_bak.yaml pubspec.yaml
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Unit & Widget Tests
        run: flutter test

  build-android-apk:
    name: 2. Build Release Android APK
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Gradle Wrapper Exists
        run: |
          cp -r lib /tmp/lib_bak
          cp -r assets /tmp/assets_bak
          cp -r android/app/src/main/res/mipmap-* /tmp/
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create . --project-name korean_step_by_step --org com.stepbystep.korean --platforms=android
          cp -r /tmp/lib_bak/* lib/
          cp -r /tmp/assets_bak/* assets/
          cp -r /tmp/mipmap-* android/app/src/main/res/
          cp /tmp/pubspec_bak.yaml pubspec.yaml

      - name: Build Android Release APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Korean_Step_by_Step_International APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Korean-Step-by-Step-International-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-and-deploy-web:
    name: 3. Build Flutter Web & Deploy to GitHub Pages
    needs: validate-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web (with GitHub Pages base-href)
        run: |
          cp -r lib /tmp/lib_bak
          cp -r assets /tmp/assets_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create . --project-name korean_step_by_step --org com.stepbystep.korean --platforms=web
          cp -r /tmp/lib_bak/* lib/
          cp -r /tmp/assets_bak/* assets/
          cp /tmp/pubspec_bak.yaml pubspec.yaml
          flutter pub get
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flutter build web --release --base-href "/${REPO_NAME}/"
          cp build/web/index.html build/web/404.html
          cp assets/web/korean_step_by_step_international.html build/web/standalone.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Build Artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

D. 多語言母語發音輔助（Native-Script Pronunciation Guide）設計
五層發音資料分離架構：
每一個學習項目（字母、單字、數字、量詞、會話句子）均嚴格分離以下 5 個獨立欄位，絕不混寫：

hangul：韓文原文（如 감사합니다、한국어、같이）—— 切換任何語言時永遠保持純正韓文。

romaji：標準文化觀光部修訂羅馬拼音（Revised Romanization，如 gamsahamnida、Hangug-eo、gachi）。

nativePron：11 語系專屬母語近似讀音字典（嚴格根據韓語音變後的實際讀音生成，而非照字面硬翻）。

actualPron：韓語實際音變讀音標示（如 [감사함니다]、[한구거]、[가치]）。

audio：韓語 ko-KR 語音合成（支援 🐢 0.24x 特慢、🚶 0.35x 初學、🏃 0.45x 標準 三段語速）。

5 個獨立顯示開關 ＋ 2 種快速模式：

使用者可於頂部工具列獨立開關：

Romanization（標準羅馬拼音）

Native Phonetics（母語文字近似讀音）

Actual [Hangul]（實際音變讀音）

Translation（母語翻譯解釋）

Pronunciation Notes（發音部位與音變提示）

並提供 🌱 初學者模式（Beginner Mode，五項全開） 與 🎓 進階模式（Advanced Mode，隱藏羅馬拼音與母語諧音，專注閱讀韓文原字） 一鍵切換。


貼上設定檔內容：打開上方的 
 複製全部內容（或直接複製下方區塊），貼進您目前 GitHub 畫面中央的 Enter file contents here 空白編輯區：

YAML
name: Build Android APK & AAB (Korean Step-by-Step)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Flutter Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify project & generate platform scaffolding if needed
        run: |
          flutter create . --project-name korean_step_by_step --org com.stepbystep.korean
          flutter pub get
          flutter test

      - name: Build Release APK (split-per-abi & universal)
        run: |
          flutter build apk --release

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:

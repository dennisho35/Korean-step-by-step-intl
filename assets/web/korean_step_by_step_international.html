  <style>
    :root {
      --bg: #F6F8FC;
      --surface: #FFFFFF;
      --surface-alt: #EEF2F9;
      --primary: #1B365D;
      --primary-light: #2B548E;
      --accent: #D6384C;
      --accent-soft: #FCE8EB;
      --teal: #0F766E;
      --teal-soft: #CCFBF1;
      --amber: #B45309;
      --amber-soft: #FEF3C7;
      --text: #0F172A;
      --text-muted: #475569;
      --border: #CBD5E1;
      --radius: 14px;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Noto Sans TC", "Noto Sans Thai", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 64px;
    }
    /* Top Header with Top-Left Language Selector & Brand Logo */
    header.top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, #152C4E 0%, #1E40AF 100%);
      color: #fff;
      padding: 10px 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.18);
    }
    .top-bar-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .left-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .lang-selector-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.35);
      padding: 5px 10px;
      border-radius: 10px;
    }
    .lang-selector-wrap label {
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 0.92;
      white-space: nowrap;
    }
    #langSelect {
      background: #FFFFFF;
      color: #0F172A;
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.7);
      background: #fff;
    }
    .brand-title {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .brand-sub {
      font-size: 0.76rem;
      opacity: 0.86;
    }
    .speed-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.35);
      padding: 4px 6px;
      border-radius: 10px;
    }
    .speed-btn {
      background: transparent;
      color: #E2E8F0;
      border: 1px solid transparent;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .speed-btn.active {
      background: #FFFFFF;
      color: #152C4E;
      font-weight: 700;
    }
    /* 5 Independent Display Toggles Bar */
    .aids-toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
    }
    .aids-toolbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .preset-group, .toggle-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .preset-btn {
      border: 1px solid var(--primary);
      background: var(--surface-alt);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .preset-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .aid-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #F8FAFC;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .aid-toggle input {
      accent-color: var(--teal);
      cursor: pointer;
    }
    /* Main Navigation Tabs */
    .main-nav {
      max-width: 1240px;
      margin: 12px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .nav-tab {
      flex: 1;
      min-width: 145px;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .nav-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(27, 54, 93, 0.22);
    }
    .sub-nav {
      max-width: 1240px;
      margin: 10px auto 0;
      padding: 0 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .sub-tab {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .sub-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .container {
      max-width: 1240px;
      margin: 12px auto;
      padding: 0 16px;
    }
    .disclaimer-banner {
      background: var(--amber-soft);
      color: #78350F;
      border-left: 4px solid var(--amber);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    /* Cards & Grids */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.12s;
    }
    .card:hover {
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .hangul-lg {
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1.15;
    }
    .hangul-md {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--surface-alt);
      color: var(--primary);
    }
    .badge.mastered { background: #DCFCE7; color: #166534; }
    .badge.review { background: #FEF3C7; color: #92400E; }
    /* 5-Layer Pronunciation Aid Pill Box */
    .pron-layers {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.84rem;
    }
    .layer-romaji { color: #2563EB; font-weight: 700; }
    .layer-native { color: #0F766E; font-weight: 700; background: #F0FDFA; padding: 2px 6px; border-radius: 5px; }
    .layer-actual { color: #9333EA; font-weight: 700; }
    .layer-trans { color: #0F172A; font-weight: 600; }
    .layer-note { color: #475569; font-size: 0.78rem; border-top: 1px dashed #CBD5E1; padding-top: 4px; margin-top: 2px; }
    /* Audio & Action Buttons */
    .audio-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-audio {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-audio.alt {
      background: var(--surface-alt);
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .btn-srs {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-srs.active-mastered {
      background: #16A34A;
      color: #fff;
      border-color: #16A34A;
    }
    .btn-srs.active-review {
      background: #D97706;
      color: #fff;
      border-color: #D97706;
    }
    /* Combiner & Canvas */
    .combiner-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .jamo-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 14px;
    }
    .jamo-btn {
      min-width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .jamo-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    canvas#writeCanvas {
      border: 2px solid var(--primary);
      border-radius: 12px;
      background: #fff;
      touch-action: none;
      cursor: crosshair;
    }
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      margin: 8px 0;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--surface);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }
    .quiz-option.correct {
      border-color: #16A34A;
      background: #DCFCE7;
      color: #14532D;
    }
    .quiz-option.wrong {
      border-color: #DC2626;
      background: #FEE2E2;
      color: #7F1D1D;
    }
    @media (max-width: 640px) {
      .hangul-lg { font-size: 1.75rem; }
      .grid-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="left-controls">
        <!-- Mandatory Top-Left Language Selector -->
        <div class="lang-selector-wrap">
          <label for="langSelect" id="lblLangSelect">🌐 Language</label>
          <select id="langSelect" aria-label="Select Language"></select>

r (없어요 → [업써요])!"},"th-TH":{"title":"8. ตัวสะกดคู่ (겹받침 — กฎการอ่านตัวซ้ายหรือตัวขวา)","desc":"ตัวสะกดคู่ส่วนใหญ่ (ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ) อ่านออกเสียงตัวซ้าย (เช่น 없다 → [업따]) ส่วน ㄺ, ㄻ, ㄿ อ่านตัวขวา (เช่น 닭 → [닥], 삶 → [삼]) แต่ถ้าตามด้วยสระ ตัวซ้ายอยู่กับที่และตัวขวาโยงเสียงไปพยางค์ถัดไป (없어요 → [업써요])"},"ja-JP":{"title":"8. 二重パッチム（겹받침 — 左読み vs 右読みと連音）","desc":"多くの二重パッチム（ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ）は左側の音を読み（例：없다 → [업따]）、ㄺ, ㄻ, ㄿ は右側を読みます（例：닭 → [닥]、삶 → [삼]）。後ろに母音が続くと右側の文字が連音します（없어요 → [업써요]）。"},"vi-VN":{"title":"8. Patchim kép (겹받침 — Quy tắc đọc bên trái hay bên phải)","desc":"Đa số patchim kép (ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ) đọc phụ âm BÊN TRÁI (VD: 없다 → [업따]), riêng ㄺ, ㄻ, ㄿ đọc phụ âm BÊN PHẢI (닭 → [닥], 삶 → [삼]). Khi nối âm với nguyên âm, chữ trái giữ nguyên, chữ phải nối sang âm sau (없어요 → [업써요])."},"fr-FR":{"title":"8. Double Batchim (겹받침 — Lecture gauche vs droite)","desc":"La plupart des doubles batchims (ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ) prononcent la consonne de GAUCHE (없다 → [업따]), tandis que ㄺ, ㄻ, ㄿ prononcent celle de DROITE (닭 → [닥]). Devant une voyelle, la droite fait la liaison (없어요 → [업써요])."},"de-DE":{"title":"8. Doppel-Batchim (겹받침 — Links- vs. Rechtslesung)","desc":"Die meisten Doppel-Batchims (ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ) sprechen den LINKEN Konsonanten (없다 → [업따]), während ㄺ, ㄻ, ㄿ den RECHTEN sprechen (닭 → [닥]). Vor Vokalen wird der rechte gebunden (없어요 → [업써요])."},"es-ES":{"title":"8. Batchim Doble (겹받침 — Lectura izquierda vs derecha)","desc":"La mayoría de batchims dobles (ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ) pronuncian la consonante IZQUIERDA (없다 → [업따]), mientras ㄺ, ㄻ, ㄿ pronuncian la DERECHA (닭 → [닥]). Ante vocal, la derecha enlaza (없어요 → [업써요])."},"ru-RU":{"title":"8. Двойной патчим (겹받침 — чтение левой или правой буквы)","desc":"Большинство двойных патчимов (ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ) читаются по ЛЕВОЙ согласной (없다 → [업따]), а ㄺ, ㄻ, ㄿ — по ПРАВОЙ (닭 → [닥]). Перед гласной правая переходит на следующий слог (없어요 → [업써요])."},"uk-UA":{"title":"8. Подвійний патчім (겹받침 — читання лівої чи правої літери)","desc":"Більшість подвійних патчімів (ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ) читаються за ЛІВОЮ приголосною (없다 → [업따]), а ㄺ, ㄻ, ㄿ — за ПРАВОЮ (닭 → [닥]). Перед голосною права переходить на наступний склад (없어요 → [업써요])."},"it-IT":{"title":"8. Doppio Batchim (겹받침 — Lettura sinistra vs destra)","desc":"La maggior parte dei doppi batchim (ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ) legge la consonante di SINISTRA (없다 → [업따]), mentre ㄺ, ㄻ, ㄿ leggono quella di DESTRA (닭 → [닥]). Davanti a vocale, la destra fa liaison (없어요 → [업써요])."},"zh-TW":{"title":"8. 雙收音（겹받침：讀左邊 vs 讀右邊與連音規則）","desc":"大多數雙收音（ㄳ, ㄵ, ㄶ, ㄼ, ㅄ, ㅀ）單獨或接子音時讀「左邊」（如 없다 [업따]）；而 ㄺ, ㄻ, ㄿ 則讀「右邊」（如 닭 [닥]、삶 [삼]）。後接母音助詞時，左邊留原位、右邊滑過去連音（없어요 [업써요]）！"}}}],"phonologicalRules":[{"id":"rule_01_liaison","order":1,"title":"1. 連音化（연음 법칙）","formula":"前字收音（ㅇ除外）＋ 後字以「ㅇ（零聲母）」開頭的母音助詞／詞尾 → 收音直接移到後字當初聲子音","explanation":"當前面的字有收音，而緊接著的下一個字是以不發音的「ㅇ」開頭（例如語法助詞 이/가、을/를、에、에서 或詞尾 -아요/-어요），前字的收音會直接滑過去取代「ㅇ」的位置發音。若是雙收音，則左邊留在原位、右邊滑過去連音。","pitfall":"注意：如果後面的字是「有實質意義的獨立單字」（如 옷 안 衣服裡面），則先轉為代表音 [옫] 再連音讀作 [오단]，而非 [오산]！","examples":[{"written":"한국어","actual":"[한구거]","romaji":"Hangug-eo [hangugeo]","zh":"韓語（국 的 ㄱ 連音至 어）","i18n":{"en-GB":"Korean language (liaison [hangugeo])","th-TH":"ภาษาเกาหลี (โยงเสียงเป็น [ฮันกูกอ])","ja-JP":"韓国語（連音化 [ハングゴ]）","vi-VN":"Tiếng Hàn (nối âm [hangugeo])","fr-FR":"Langue coréenne (liaison [hangougo])","de-DE":"Koreanische Sprache (Bindung [hangugo])","es-ES":"Idioma coreano (enlace [jangugo])","ru-RU":"Корейский язык (льезон [хангуго])","uk-UA":"Корейська мова (льєзон [ханґуґо])","it-IT":"Lingua coreana (liaison [hangugo])","zh-TW":"韓語（국 的 ㄱ 連音至 어）"}},{"written":"먹어요","actual":"[머거요]","romaji":"meog-eoyo [meogeoyo]","zh":"吃（먹 的 ㄱ 連音至 어）","i18n":{"en-GB":"eat / eats (liaison [meogeoyo])","th-TH":"กิน/ทาน (โยงเสียงเป็น [มอกอโย])","ja-JP":"食べます（連音化 [モゴヨ]）","vi-VN":"ăn (nối âm [meogeoyo])","fr-FR":"mange (liaison [mogoyo])","de-DE":"isst (Bindung [mogoyo])","es-ES":"come (enlace [mogoyo])","ru-RU":"ем / ест (льезон [могоё])","uk-UA":"їм / їсть (льєзон [моґойо])","it-IT":"mangio / mangia (liaison [mogoyo])","zh-TW":"吃（먹 的 ㄱ 連音至 어）"}},{"written":"꽃이","actual":"[꼬치]","romaji":"kkoch-i [kkochi]","zh":"花（主格助詞 이，恢復原收音 ㅊ 連音）","i18n":{"en-GB":"꽃이 → [꼬치] (kkoch-i [kkochi])","th-TH":"꽃이 → [꼬치] (kkoch-i [kkochi])","ja-JP":"꽃이 → [꼬치] (kkoch-i [kkochi])","vi-VN":"꽃이 → [꼬치] (kkoch-i [kkochi])","fr-FR":"꽃이 → [꼬치] (kkoch-i [kkochi])","de-DE":"꽃이 → [꼬치] (kkoch-i [kkochi])","es-ES":"꽃이 → [꼬치] (kkoch-i [kkochi])","ru-RU":"꽃이 → [꼬치] (kkoch-i [kkochi])","uk-UA":"꽃이 → [꼬치] (kkoch-i [kkochi])","it-IT":"꽃이 → [꼬치] (kkoch-i [kkochi])","zh-TW":"花（主格助詞 이，恢復原收音 ㅊ 連音）"}},{"written":"있어요","actual":"[이써요]","romaji":"iss-eoyo [isseoyo]","zh":"有／在（雙子音收音 ㅆ 直接連音至 어）","i18n":{"en-GB":"있어요 → [이써요] (iss-eoyo [isseoyo])","th-TH":"있어요 → [이써요] (iss-eoyo [isseoyo])","ja-JP":"있어요 → [이써요] (iss-eoyo [isseoyo])","vi-VN":"있어요 → [이써요] (iss-eoyo [isseoyo])","fr-FR":"있어요 → [이써요] (iss-eoyo [isseoyo])","de-DE":"있어요 → [이써요] (iss-eoyo [isseoyo])","es-ES":"있어요 → [이써요] (iss-eoyo [isseoyo])","ru-RU":"있어요 → [이써요] (iss-eoyo [isseoyo])","uk-UA":"있어요 → [이써요] (iss-eoyo [isseoyo])","it-IT":"있어요 → [이써요] (iss-eoyo [isseoyo])","zh-TW":"有／在（雙子音收音 ㅆ 直接連音至 어）"}}],"i18n":{"en-GB":{"title":"1. Liaison / Resyllabification (연음 법칙)","explanation":"When a syllable ending in a final consonant (except ㅇ) is followed by a grammatical particle or ending starting with silent 'ㅇ' (e.g. 이/가, 을/를, 에, -아요/-어요), the batchim slides over to become the initial consonant of the next syllable (한국어 → [한구거])."},"th-TH":{"title":"1. กฎการโยงเสียง (연음 법칙 Liaison)","explanation":"เมื่อพยางค์หน้ามีตัวสะกด (ยกเว้น ㅇ) และพยางค์ถัดไปขึ้นต้นด้วยสระที่มี ㅇ นำหน้า เสียงตัวสะกดจะเลื่อนไปเป็นพยัญชนะต้นของพยางค์ถัดไปทันที เช่น 한국어 → [한구거]"},"ja-JP":{"title":"1. 連音化（연음 법칙）","explanation":"前の文字にパッチム（ㅇ以外）があり、次の文字が母音（無音のㅇ）で始まる助詞や語尾の場合、パッチムがそのまま次の文字の初声の位置へ移動して発音されます（한국어 → [한구거]）。"},"vi-VN":{"title":"1. Quy tắc Nối âm (연음 법칙)","explanation":"Khi âm tiết trước có phụ âm cuối (trừ ㅇ) và âm tiết sau bắt đầu bằng phụ âm câm ㅇ, phụ âm cuối sẽ trượt sang làm phụ âm đầu của âm tiết sau (한국어 → [한구거])."},"fr-FR":{"title":"1. Liaison vocalique (연음 법칙)","explanation":"Lorsqu'une syllabe avec batchim (sauf ㅇ) est suivie d'une voyelle débutant par ㅇ muet, le batchim glisse sur la syllabe suivante (한국어 → [한구거])."},"de-DE":{"title":"1. Bindung / Liaison (연음 법칙)","explanation":"Folgt auf einen Endkonsonanten (außer ㅇ) eine mit stummem ㅇ beginnende Endung, wird der Konsonant hinübergezogen (한국어 → [한구거])."},"es-ES":{"title":"1. Enlace / Liaison (연음 법칙)","explanation":"Cuando una sílaba con batchim (excepto ㅇ) va seguida de una partícula que empieza por ㅇ muda, el batchim pasa a la siguiente sílaba (한국어 → [한구거])."},"ru-RU":{"title":"1. Правило связывания / Льезон (연음 법칙)","explanation":"Если после слога с патчимом (кроме ㅇ) идёт окончание или частица на гласную (с немым ㅇ), согласный переходит в начало следующего слога (한국어 → [한구거])."},"uk-UA":{"title":"1. Правило зв'язування / Льєзон (연음 법칙)","explanation":"Якщо після складу з патчімом (крім ㅇ) йде закінчення або частка на голосну (з німим ㅇ), приголосний переходить на початок наступного складу (한국어 → [한구거])."},"it-IT":{"title":"1. Liaison / Legamento (연음 법칙)","explanation":"Quando una sillaba con batchim (eccetto ㅇ) è seguita da una vocale con ㅇ muta, la consonante finale si lega alla sillaba successiva (한국어 → [한구거])."},"zh-TW":{"title":"1. 連音化（연음 법칙）","explanation":"當前面的字有收音（ㅇ除外），而緊接著的下一個字是以不發音的「ㅇ」開頭的助詞或詞尾時，前字的收音直接滑過去當後字的初聲（如 한국어 → [한구거]）。"}}},{"id":"rule_02_nasalization","order":2,"title":"2. 鼻音化（비음화）— 含「합니다 [함니다]」核心規則","formula":"塞音收音 [ㄱ, ㄷ, ㅂ] ＋ 鼻音子音 [ㄴ, ㅁ] → 收音同化為同部位鼻音 [ㅇ, ㄴ, ㅁ]","explanation":"【韓語最高頻音變】當收音代表音 [ㄱ]、[ㄷ]、[ㅂ] 後面遇到鼻音子音「ㄴ」或「ㅁ」時，為了發音順暢，前面的塞音收音會被同化成同部位的鼻音：ㄱ→[ㅇ]、ㄷ→[ㄴ]、ㅂ→[ㅁ]！這就是為什麼「감사합니다（謝謝）」、「입니다（是）」的 ㅂ 遇到 ㄴ 一律讀作 [ㅁ (m)]！此外，收音 [ㅁ, ㅇ] 後接「ㄹ」時，ㄹ 也會鼻音化讀作 [ㄴ]（如 음료수 [음뇨수] 飲料）。","pitfall":"初學者看字常把 감사합니다 念成 gam-sa-hap-ni-da，正確標準語必須鼻音化讀作 [감사함니다 gamsahamnida]！","examples":[{"written":"감사합니다","actual":"[감사함니다]","romaji":"gamsahamnida","zh":"謝謝（ㅂ + ㄴ → ㅁ + ㄴ）","i18n":{"en-GB":"Thank you (formal; nasalized [gamsahamnida])","th-TH":"ขอบคุณครับ/ค่ะ (เปลี่ยนเสียงเป็น [คัมซาฮัมนีดา])","ja-JP":"ありがとうございます（鼻音化 [カムサハムニダ]）","vi-VN":"Cảm ơn (biến âm mũi [gamsahamnida])","fr-FR":"Merci (formel ; nasalisé [kamsahamnida])","de-DE":"Danke (formell; nasaliert [kamsahamnida])","es-ES":"Gracias (formal; nasalizado [kamsajamnida])","ru-RU":"Спасибо (офиц.; назализация [камсахамнида])","uk-UA":"Дякую (офіц.; назалізація [камсахамніда])","it-IT":"Grazie (formale; nasalizzato [kamsahamnida])","zh-TW":"謝謝（注意鼻音化 [감사함니다]）"}},{"written":"입니다","actual":"[임니다]","romaji":"imnida","zh":"是（ㅂ + ㄴ → ㅁ + ㄴ）","i18n":{"en-GB":"입니다 → [임니다] (imnida)","th-TH":"입니다 → [임니다] (imnida)","ja-JP":"입니다 → [임니다] (imnida)","vi-VN":"입니다 → [임니다] (imnida)","fr-FR":"입니다 → [임니다] (imnida)","de-DE":"입니다 → [임니다] (imnida)","es-ES":"입니다 → [임니다] (imnida)","ru-RU":"입니다 → [임니다] (imnida)","uk-UA":"입니다 → [임니다] (imnida)","it-IT":"입니다 → [임니다] (imnida)","zh-TW":"是（ㅂ + ㄴ → ㅁ + ㄴ）"}},{"written":"한국말","actual":"[한궁말]","romaji":"Hangungmal","zh":"韓國話（ㄱ + ㅁ → ㅇ + ㅁ）","i18n":{"en-GB":"한국말 → [한궁말] (Hangungmal)","th-TH":"한국말 → [한궁말] (Hangungmal)","ja-JP":"한국말 → [한궁말] (Hangungmal)","vi-VN":"한국말 → [한궁말] (Hangungmal)","fr-FR":"한국말 → [한궁말] (Hangungmal)","de-DE":"한국말 → [한궁말] (Hangungmal)","es-ES":"한국말 → [한궁말] (Hangungmal)","ru-RU":"한국말 → [한궁말] (Hangungmal)","uk-UA":"한국말 → [한궁말] (Hangungmal)","it-IT":"한국말 → [한궁말] (Hangungmal)","zh-TW":"韓國話（ㄱ + ㅁ → ㅇ + ㅁ）"}},{"written":"작년","actual":"[장년]","romaji":"jangnyeon","zh":"去年（ㄱ + ㄴ → ㅇ + ㄴ）","i18n":{"en-GB":"작년 → [장년] (jangnyeon)","th-TH":"작년 → [장년] (jangnyeon)","ja-JP":"작년 → [장년] (jangnyeon)","vi-VN":"작년 → [장년] (jangnyeon)","fr-FR":"작년 → [장년] (jangnyeon)","de-DE":"작년 → [장년] (jangnyeon)","es-ES":"작년 → [장년] (jangnyeon)","ru-RU":"작년 → [장년] (jangnyeon)","uk-UA":"작년 → [장년] (jangnyeon)","it-IT":"작년 → [장년] (jangnyeon)","zh-TW":"去年（ㄱ + ㄴ → ㅇ + ㄴ）"}},{"written":"있는","actual":"[인는]","romaji":"inneun","zh":"有的〜（ㅆ代表音[ㄷ] + ㄴ → ㄴ + ㄴ）","i18n":{"en-GB":"있는 → [인는] (inneun)","th-TH":"있는 → [인는] (inneun)","ja-JP":"있 alen (ㅎ 탈락)","explanation":"Vor einer Vokalendung fällt das Batchim ㅎ komplett weg: 좋아요 → [조아요], 많이 → [마니]."},"es-ES":{"title":"7. Elisión de ㅎ entre vocales (ㅎ 탈락)","explanation":"Ante una terminación vocálica, el batchim ㅎ desaparece por completo: 좋아요 → [조아요], 많이 → [마니]."},"ru-RU":{"title":"7. Выпадение ㅎ перед гласной (ㅎ 탈락)","explanation":"Перед гласным окончанием патчим ㅎ полностью выпадает: 좋아요 → [조아요], 많이 → [마니]."},"uk-UA":{"title":"7. Випадіння ㅎ перед голосною (ㅎ 탈락)","explanation":"Перед голосним закінченням патчім ㅎ повністю випадає: 좋아요 → [조아요], 많이 → [마니]."},"it-IT":{"title":"7. Caduta della ㅎ intervocalica (ㅎ 탈락)","explanation":"Davanti a una desinenza vocalica, il batchim ㅎ cade completamente: 좋아요 → [조아요], 많이 → [마니]."},"zh-TW":{"title":"7. ㅎ 脫落與弱化（ㅎ 탈락）","explanation":"當收音 ㅎ（含雙收音 ㄶ, ㅀ）後面接母音開頭的語尾時，ㅎ 完全脫落不發音：例如 좋아요（好）讀作 [조아요]，많이（很多）讀作 [마니]。"}}}],"numberSystemComparison":[{"situation":"1. 計算一般物件數量（個 개、杯 잔、瓶 병、本 권、張 장）","system":"固有韓語數詞 (하나→한, 둘→두...)","example":"아메리카노 두 잔 (兩杯美式)、이거 세 개 (這個三個)","note":"超過 40~50 以上的大數量在口語中常改用漢字數詞。"},{"situation":"2. 計算人數（명 / 분）与動物隻數（마리）","system":"固有韓語數詞 (한 명, 두 분, 세 마리)","example":"네 명이에요 (四個人)、강아지 한 마리 (一隻小狗)","note":"注意：餐廳點「幾人份餐點（인분）」則用漢字數詞（삼겹살 이 인분 兩人份五花肉）！"},{"situation":"3. 計算年齡（日常口語 살 vs 正式公文 세）","system":"口語：固有數詞＋살 ／ 正式：漢字數詞＋세","example":"스무 살 (20歲，口語) vs 이십 세 (20歲，正式)","note":"詢問小朋友或日常聊天多用 몇 살이에요?；長輩則用 연세가 어떻게 되세요?"},{"situation":"4. 表達時間的「幾點（시）」vs「幾分（분）・幾秒（초）」","system":"小時(시)：固有數詞 ／ 分(분)・秒(초)：漢字數詞","example":"세 시 십오 분 (3點15分：세=固有，십오=漢字)","note":"這是韓語時間最經典的「時固有、分漢字」混合規則！計算「幾個小時（시간）」也用固有數詞（두 시간 兩小時）。"},{"situation":"5. 日期（일）、月份（월）、年份（년）","system":"漢字韓語數詞 (일, 이, 삼...)","example":"이천이십육 년 유월 십오일 (2026年6月15日)","note":"特例：6月讀 유월、10月讀 시월；計算「幾個月（달 vs 개월）」則 두 달(固有) = 이 개월(漢字)。"},{"situation":"6. 金額價格（원）、樓層（층）、公車/地鐵號次（번/호선）","system":"漢字韓語數詞 (일, 이, 삼...)","example":"삼천오백 원 (3,500韓元)、삼 층 (3樓)、이 호선 (2號線)","note":"注意計算「幾次（번）」則用固有數詞（한 번 一次、두 번 兩次）！"},{"situation":"7. 電話號碼（전화번호）、房號、數學與百分比（프로/%）","system":"漢字韓語數詞 (공/영, 일, 이, 삼...)","example":"공일공에 일삼오칠 (010-1357)、오십 프로 (50%)","note":"電話中的 0 讀作 공 (gong)，連接號「-」讀作 에 (e)。"}],"numbersCategories":[{"id":"num_native_basic","title":"1. 基本固有韓語數詞（1-10、20-90 及量詞縮略形・一格一個）","description":"固有數詞用於計數、人數、年齡、幾點鐘。注意 1(한)、2(두)、3(세)、4(네)、20(스무) 在量詞前的縮略變化！","items":[{"num":"1","system":"固有數詞","korean":"하나","actualPron":"[하나] · 量詞形：한 (han)","romaji":"hana","irregular":true,"note":"一（固有數詞；後接量詞時縮略為「한」，如 한 개 一個、한 명 一個人、한 시 一點）","exampleKr":"이거 한 개 주세요.","exampleZh":"請給我這個 1 個。"},{"num":"2","system":"固有數詞","korean":"둘","actualPron":"[둘] · 量詞形：두 (du)","romaji":"dul","irregular":true,"note":"二（固有數詞；後接量詞時縮略為「두」，如 두 개 兩個、두 잔 兩杯）","exampleKr":"이거 두 개 주세요.","exampleZh":"請給我這個 2 個。"},{"num":"3","system":"固有數詞","korean":"셋","actualPron":"[섿] · 量詞形：세 (se)","romaji":"set","irregular":true,"note":"三（固有數詞；後接量詞時縮略為「세」，如 세 개 三個、세 시 三點）","exampleKr":"이거 세 개 주세요.","exampleZh":"請給我這個 3 個。"},{"num":"4","system":"固有數詞","korean":"넷","actualPron":"[넫] · 量詞形：네 (ne)","romaji":"net","irregular":true,"note":"四（固有數詞；後接量詞時縮略為「네」，如 네 명 四個人、네 권 四本）","exampleKr":"이거 네 개 주세요.","exampleZh":"請給我這個 4 個。"},{"num":"5","system":"固有數詞","korean":"다섯","actualPron":"[다섣] · 量詞形：다섯 (daseot)","romaji":"daseot","irregular":false,"note":"五（固有數詞；後接量詞時維持原形 다섯，如 다섯 개 五個）","exampleKr":"이거 다섯 개 주세요.","exampleZh":"請給我這個 5 個。"},{"num":"6","system":"固有數詞","korean":"여섯","actualPron":"[여섣] · 量詞形：여섯 (yeoseot)","romaji":"yeoseot","irregular":false,"note":"六（固有數詞；實際發音收音讀 [여섣]，如 여섯 시 六點）","exampleKr":"이거 여섯 개 주세요.","exampleZh":"請給我這個 6 個。"},{"num":"7","system":"固有數詞","korean":"일곱","actualPron":"[일곱] · 量詞形：일곱 (ilgop)","romaji":"ilgop","irregular":false,"note":"七（固有數詞；如 일곱 명 七個人）","exampleKr":"이거 일곱 개 주세요.","exampleZh":"請給我這個 7 個。"},{"num":"8","system":"固有數詞","korean":"여덟","actualPron":"[여덜] · 量詞形：여덟 (yeodeol)","romaji":"yeodeol","irregular":true,"note":"八（固有數詞；雙收音 ㄼ 讀左邊 [ㄹ]，實際讀作 [여덜]）","exampleKr":"이거 여덟 개 주세요.","exampleZh":"請給我這個 8 個。"},{"num":"9","system":"固有數詞","korean":"아홉","actualPron":"[아홉] · 量詞形：아홉 (ahop)","romaji":"ah our.","de-DE":"Willkommen! Guten Tag.","es-ES":"¡Bienvenido! Hola.","ru-RU":"Добро пожаловать! Здравствуйте.","uk-UA":"Ласкаво просимо! Вітаю.","it-IT":"Benvenuto! Salve.","zh-TW":"歡迎光臨！您好。"}},{"id":"c01_l2","speaker":"旅客","kr":"안녕하세요. 이거 좀 볼 수 있어요?","actual":"[안녕하세요. 이거 좀 볼 쑤 이써요]","romaji":"Annyeonghaseyo. Igeo jom bol su isseoyo?","zh":"您好。請問可以看一下這個嗎？","note":"「-(으)ㄹ 수 있어요?」表示「可以〜嗎？」。","i18n":{"en-GB":"Hello. May I take a look at this?","th-TH":"สวัสดีครับ/ค่ะ ขอดูอันนี้หน่อยได้ไหม?","ja-JP":"こんにちは。これを少し見てもいいですか？","vi-VN":"Xin chào. Tôi có thể xem cái này một chút được không?","fr-FR":"Bonjour. Puis-je regarder ceci ?","de-DE":"Hallo. Darf ich mir das mal ansehen?","es-ES":"Hola. ¿Puedo ver esto un momento?","ru-RU":"Здравствуйте. Можно мне это посмотреть?","uk-UA":"Вітаю. Можна мені це подивитися?","it-IT":"Salve. Posso dare un'occhiata a questo?","zh-TW":"您好。請問可以看一下這個嗎？"}},{"id":"c01_l3","speaker":"店員","kr":"네, 편하게 보세요.","actual":"[네, 편하게 보세요]","romaji":"Ne, pyeonhage boseyo.","zh":"好的，請隨意看。","note":"「편하게」意為「自在地、輕鬆地」。","i18n":{"en-GB":"Yes, please feel free to look around.","th-TH":"ได้ครับ/ค่ะ เชิญดูตามสบายเลย","ja-JP":"はい、どうぞごゆっくりご覧ください。","vi-VN":"Vâng, xin cứ tự nhiên xem ạ.","fr-FR":"Oui, regardez tranquillement.","de-DE":"Ja, schauen Sie sich gern in Ruhe um.","es-ES":"Sí, mire con toda comodidad.","ru-RU":"Да, смотрите спокойно, пожалуйста.","uk-UA":"Так, дивіться спокійно, будь ласка.","it-IT":"Sì, guardi pure con calma.","zh-TW":"好的，請隨意看。"}},{"id":"c01_l4","speaker":"旅客","kr":"감사합니다! 죄송하지만 사진 찍어도 돼요?","actual":"[감사함니다! 줴송하지만 사진 찌거도 돼요]","romaji":"Gamsahamnida! Joesonghajiman sajin jjigeodo dwaeyo?","zh":"謝謝！不好意思，請問可以拍照嗎？","note":"「-아/어도 돼요?」表示「可以做〜嗎？（徵求許可）」。","i18n":{"en-GB":"Thank you! Excuse me, is it okay if I take a photo?","th-TH":"ขอบคุณครับ/ค่ะ! ขอโทษนะครับ/คะ ถ่ายรูปได้ไหม?","ja-JP":"ありがとうございます！すみませんが、写真を撮ってもいいですか？","vi-VN":"Cảm ơn! Xin lỗi nhưng tôi chụp ảnh có được không?","fr-FR":"Merci ! Excusez-moi, puis-je prendre une photo ?","de-DE":"Danke! Entschuldigung, darf ich ein Foto machen?","es-ES":"¡Gracias! Disculpe, ¿puedo tomar una foto?","ru-RU":"Спасибо! Извините, можно сфотографировать?","uk-UA":"Дякую! Перепрошую, можна сфотографувати?","it-IT":"Grazie! Mi scusi, posso fare una foto?","zh-TW":"謝謝！不好意思，請問可以拍照嗎？"}}],"practiceQuestion":{"prompt":"在韓國無論早上、下午或晚上遇到店員或鄰居，最自然通用的「你好」怎麼說？","options":["안녕하세요 (Annyeonghaseyo)","감사합니다 (Gamsahamnida)","죄송합니다 (Joesonghamnida)","잘 먹겠습니다 (Jal meokgetseumnida)"],"correctIndex":0,"explanation":"「안녕하세요 (Annyeonghaseyo)」是全天候通用的標準禮貌問候語。"},"i18nTitle":{"en-GB":"1. Basic Greetings (Hello, Thank You, Excuse Me)","th-TH":"1. การทักทายพื้นฐาน (สวัสดี ขอบคุณ ขอโทษ)","ja-JP":"1. 基本の挨拶（こんにちは・ありがとう・すみません）","vi-VN":"1. Chào hỏi cơ bản (Xin chào, Cảm ơn, Xin lỗi)","fr-FR":"1. Salutations de base (Bonjour, Merci, Pardon)","de-DE":"1. Grundlegende Begrüßungen (Hallo, Danke, Entschuldigung)","es-ES":"1. Saludos básicos (Hola, Gracias, Disculpe)","ru-RU":"1. Базовые приветствия (Здравствуйте, Спасибо, Извините)","uk-UA":"1. Базові привітання (Вітаю, Дякую, Перепрошую)","it-IT":"1. Saluti di base (Salve, Grazie, Mi scusi)","zh-TW":"1. 基本打招呼（你好、感謝、對不起）"}},{"id":"conv_02_time_greetings_farewell","order":2,"title":"2. 早安、晚安及道別（請慢走 vs 請留步）","category":"基礎社交","level":"入門 TOPIK I","situation":"早上起床問候、睡前道晚安，以及離開商店或與朋友道別時的關鍵區分。","grammarNote":"【韓語道別必考雙胞胎】① 當對方要離開、自己留在原地（如店員送客、主人在家送客）：說「안녕히 가세요 (請平安地走＝慢走)」；② 當自己要離開、對方留在原地（如顧客離開餐廳或商店）：對店員說「안녕히 계세요 (請平安地留著＝請留步/再見)」！若雙方同時各自離開回家，則彼此都說「안녕히 가세요」。","formalVsInformal":"禮貌敬語：안녕히 가세요 (慢走) ／ 안녕히 계세요 (請留步) ／ 안녕히 주무세요 (晚安)\n朋友平語：잘 가 (慢走) ／ 잘 있어 (再見) ／ 잘 자 (晚安)","vocab":[{"kr":"좋은 아침이에요","actual":"[조은 아치미에요]","romaji":"joeun achim-ieyo","zh":"早安（美好早晨）","i18n":{"en-GB":"joeun achim-ieyo (早安（美好早晨）)","th-TH":"joeun achim-ieyo (早安（美好早晨）)","ja-JP":"joeun achim-ieyo (早安（美好早晨）)","vi-VN":"joeun achim-ieyo (早安（美好早晨）)","fr-FR":"joeun achim-ieyo (早安（美好早晨）)","de-DE":"joeun achim-ieyo (早安（美好早晨）)","es-ES":"joeun achim-ieyo (早安（美好早晨）)","ru-RU":"joeun achim-ieyo (早安（美好早晨）)" :"對長輩問早安則說「안녕히 주무셨어요?（您睡得好嗎？）」。","i18n":{"en-GB":"Good morning! Did you sleep well last night?","th-TH":"อรุณสวัสดิ์! เมื่อคืนหลับสบายไหม?","ja-JP":"おはようございます！昨日はよく眠れましたか？","vi-VN":"Chào buổi sáng! Đêm qua bạn ngủ có ngon không?","fr-FR":"Bonjour ! Avez-vous bien dormi hier soir ?","de-DE":"Guten Morgen! Haben Sie letzte Nacht gut geschlafen?","es-ES":"¡Buenos días! ¿Dormiste bien anoche?","ru-RU":"Доброе утро! Хорошо спали прошлой ночью?","uk-UA":"Доброго ранку! Добре спали минулої ночі?","it-IT":"Buongiorno! Hai dormito bene ieri notte?","zh-TW":"早安！昨晚睡得好嗎？"}},{"id":"c02_l2","speaker":"旅客（離開咖啡廳）","kr":"커피 잘 마셨습니다. 안녕히 계세요!","actual":"[커피 잘 마쎳씀니다. 안녕히 계세요]","romaji":"Keopi jal masyeotseumnida. Annyeonghi gyeseyo!","zh":"咖啡很好喝。再見（請留步）！","note":"因為店員留在店裡，離開的顧客要說「안녕히 계세요」。","i18n":{"en-GB":"I really enjoyed the coffee. Goodbye (stay well)!","th-TH":"กาแฟอร่อยมากครับ/ค่ะ ลาแล้วนะครับ/คะ (ขอให้อยู่ดีมีสุข)!","ja-JP":"コーヒーとても美味しかったです。さようなら（お元気でいてください）！","vi-VN":"Cà phê rất ngon ạ. Tạm biệt (chúc ở lại mạnh khỏe)!","fr-FR":"Le café était très bon. Au revoir (restez bien) !","de-DE":"Der Kaffee hat sehr gut geschmeckt. Auf Wiedersehen (bleiben Sie wohlauf)!","es-ES":"El café estuvo muy rico. ¡Adiós (quédese bien)!","ru-RU":"Кофе был очень вкусным. До свидания (оставайтесь с миром)!","uk-UA":"Кава була дуже смачною. До побачення (залишайтеся в мирі)!","it-IT":"Il caffè era ottimo. Arrivederci (stia bene)!","zh-TW":"咖啡很好喝。再見（請留步）！"}},{"id":"c02_l3","speaker":"店員（送客）","kr":"네, 감사합니다. 안녕히 가세요!","actual":"[네, 감사함니다. 안녕히 가세요]","romaji":"Ne, gamsahamnida. Annyeonghi gaseyo!","zh":"好的，謝謝您。請慢走！","note":"店員目送客人離開，所以對客人說「안녕히 가세요」。","i18n":{"en-GB":"Yes, thank you. Goodbye (go safely)!","th-TH":"ครับ/ค่ะ ขอบคุณมาก เดินทางปลอดภัยนะครับ/คะ!","ja-JP":"はい、ありがとうございます。さようなら（お気をつけてお帰りください）！","vi-VN":"Vâng, cảm ơn quý khách. Tạm biệt (đi thong thả nhé)!","fr-FR":"Oui, merci. Au revoir (bonne route) !","de-DE":"Ja, vielen Dank. Auf Wiedersehen (kommen Sie gut heim)!","es-ES":"Sí, gracias. ¡Adiós (vaya con bien)!","ru-RU":"Да, спасибо. До свидания (идите с миром)!","uk-UA":"Так, дякую. До побачення (ідіть з миром)!","it-IT":"Sì, grazie. Arrivederci (buon rientro)!","zh-TW":"好的，謝謝您。請慢走！"}}],"practiceQuestion":{"prompt":"當你在韓國餐廳吃完飯、準備走出店門時，應該對留在店裡的店員說哪一句「再見」？","options":["안녕히 계세요 (Annyeonghi gyeseyo)","안녕히 가세요 (Annyeonghi gaseyo)","어서 오세요 (Eoseo oseyo)","처음 뵙겠습니다 (Cheoeum boepgetseumnida)"],"correctIndex":0,"explanation":"店員留在店內，因此離開的顧客應說「안녕히 계세요（請平安留步）」。"},"i18nTitle":{"en-GB":"2. Morning Greeting & Farewells (Stay Well vs Go Well)","th-TH":"2. อรุณสวัสดิ์และการบอกลา (อยู่ดีๆ นะ vs เดินทางดีๆ นะ)","ja-JP":"2. 朝の挨拶とお別れ（さようなら：残る人へ vs 去る人へ）","vi-VN":"2. Chào buổi sáng & Tạm biệt (Người ở lại vs Người rời đi)","fr-FR":"2. Bonjour le matin et Au revoir (Rester vs Partir)","de-DE":"2. Guten Morgen & Abschied (Bleiben vs. Gehen)","es-ES":"2. Buenos días y Despedidas (Quedarse vs Irse)","ru-RU":"2. Доброе утро и Прощание (Остающемуся vs Уходящему)","uk-UA":"2. Доброго ранку та Прощання (Тому, хто залишається vs йде)","it-IT":"2. Buongiorno e Saluti d'addio (Chi resta vs Chi parte)","zh-TW":"2. 早安、晚安及道別（請慢走 vs 請留步）"}},{"id":"conv_03_self_intro","order":3,"title":"3. 自我介紹（姓名、國籍、職業）","category":"基礎社交","level":"入門 TOPIK I","situation":"向韓國朋友或導遊介紹自己的名字、來自香港或台灣。","grammarNote":"主題助詞「은/는」與尾語「이에요/예요（是）」：若前面的名詞「有收音」接「은 / 이에요」（如 대만 사람이에요 是台灣人）；若前面的名詞「無收音」則接「는 / 예요」（如 저는 민수예요 我是敏秀）。正式場合則統一接「입니다 [임니다]」。","formalVsInformal":"正式敬語：저는 홍콩에서 온 진이라고 합니다.\n標準禮貌：저는 홍콩에서 왔어요. 이름은 진이에요.","vocab":[{"kr":"저","actual":"[저]","romaji":"jeo","zh":"我（謙稱）","i18n":{"en-GB":"jeo (我（謙稱）)","th-TH":"jeo (我（謙稱）)","ja-JP":"jeo (我（謙稱）)","vi-VN":"jeo (我（謙稱）)","fr-FR":"jeo (我（謙稱）)","de-DE":"jeo (我（謙稱）)","es-ES":"jeo (我（謙稱）)","ru-RU":"jeo (我（謙稱）)","uk-UA":"jeo (我（謙稱）)","it-IT":"jeo (我（謙稱）)","zh-TW":"我（謙稱）"}},{"kr":"홍콩 / 대만","actual":"[홍콩 / 대만]","romaji":"Hongkong / Daeman","zh":"香港 ／ 台灣","i18n":{"en-GB":"Hongkong / Daeman (香港 ／ 台灣)","th-TH":"Hongkong / Daeman (香港 ／ 台灣)","ja-JP":"Hongkong / Daeman (香港 ／ 台灣)","vi-VN":"Hongkong / Daeman (香港 ／ 台灣)","fr-FR":"Hongkong / Daeman (香港 ／ 台灣)","de-DE":"Hongkong / Daeman (香港 ／ 台灣)","es-ES":"Hongkong / Daeman (香港 ／ 台灣)","ru-RU":"Hongkong / Daeman (香港 ／ 台灣)","uk-UA":"Hongkong / Daeman (香港 ／ 台灣)","it-IT":"Hongkong / Daeman (香港 ／ 台灣)","zh-TW":"香港 ／ 台灣"}},{"kr":"사람","actual":"[사람]","romaji":"saram","zh":"人","i18n":{"en-GB":"saram (人)","th-TH":"saram (人)","ja-JP":"saram (人)","vi-VN":"saram (人)","fr-FR":"saram (人)","de-DE":"saram (人)","es-ES":"saram (人)","ru-RU":"saram (人)","uk-UA":"saram (人)","it-IT":"saram (人)","zh-TW":"人"}},{"kr":"여행객","actual":"[여행객]","romaji":"yeohaenggaek","zh":"旅客","i18n":{"en-GB":"yeohaenggaek (旅客)","th-TH":"yeohaenggaek (旅客)","ja-JP":"yeohaenggaek (旅客)","vi-VN":"yeohaenggaek (旅客)","fr-FR":"yeohaenggaek (旅客)","de-DE":"yeohaenggaek (旅客)","es-ES":"yeohaenggaek (旅客)","ru-RU":"yeohaenggaek (旅客)","uk-UA":"yeohaenggaek (旅客)","it-IT":"yeohaenggaek (旅客)","zh-TW":"旅客"}}],"lines":[{"id":"c03_l1","speaker":"旅客","kr":"안녕하세요. 저는 홍콩에서 왔어요.","actual":"[안녕하세요. 저는 홍콩에서 와써요]","romaji":"Annyeonghaseyo. Jeoneun Hongkong-eseo wasseoyo.","zh":"你好。我從香港來。","note":"若從台灣來可說「대만에서 왔어요 (Daeman-eseo wasseoyo)」。","i18n":{"en-GB":"Hello. I came from Abroad / Hong Kong.","th-TH":"สวัสดีครับ/ค่ะ ฉันมาจากฮ่องกง","ja-JP":"こんにちは。私は香港から来ました。","vi-VN":"Xin chào. Tôi đến từ Hồng Kông.","fr-FR":"Bonjour. Je viens de Hong Kong.","de-DE":"Hallo. Ich komme aus Hongkong.","es-ES":"Hola. Vengo de Hong Kong.","ru-RU":"Здравствуйте. Я приехал(а) из Гонконга.","uk-UA":"Вітаю. Я приїхав(ла) з Гонконгу.","it-IT":"Salve. Vengo da Hong Kong.","zh-TW":"你好。我從香港來。"}},{"id":"c03_l2","speaker":"旅客","kr":"제 이름은 케빈이에요. 한국 여행을 왔어요.","actual":"[제 이르믄 케비니에요. 한국 여해을 와써요]","romaji":"Je ireum-eun Kebin-ieyo. Hanguk yeohaeng-eul wasseoyo.","zh":"我的名字是 Kevin。我來韓國旅行。","note":"케빈 (Kebin) 有收音 ㄴ，因此後面接「이에요」。","i18n":{"en-GB":"My name is Kevin. I came to Korea for a trip.","th-TH":"ฉันชื่อเควิน มาเที่ยวที่เกาหลีครับ","ja-JP":"私の名前はケビンです。韓国旅行に来ました。","vi-VN":"Tên tôi là Kevin. Tôi đến Hàn Quốc du lịch.","fr-FR":"Je m'appelle Kevin. Je suis venu voyager en Corée.","de-DE":"Ich heiße Kevin. Ich bin für eine Reise nach Korea gekommen.","es-ES":"Me llamo Kevin. Vine de viaje a Corea.","ru-RU":"Меня зовут Кевин. Я приехал в Корею в путешествие.","uk-UA":"Мене звати Кевін. Я приїхав до Кореї у подорож.","it-IT":"Mi chiamo Kevin. Sono venuto in Corea in viaggio.","zh-TW":"我的名字是 Kevin。我來韓國旅行。"}},{"id":"c03_l3","speaker":"韓國朋友","kr":"반가워요, 케빈 씨! 한국에 오신 것을 환영해요.","actual":"[반가워요, 케빈 씨! 한구게 오신 거슬 화녕해요]","romaji":"Bangawoyo, Kebin ssi! Hangug-e osin geoseul hwanyeonghaeyo.","zh":"很高興認識你，Kevin！歡迎來到韓國。","note":"稱呼平輩名字後加上「씨 (ssi 先生/小姐)」，不可加在自己名字後。","i18n":{"en-GB":"Nice to meet you, Kevin! Welcome to Korea.","th-TH":"ยินดีที่ได้รู้จักครับคุณเควิน! ยินดีต้อนรับสู่เกาหลี","ja-JP":"はじめまして、ケビンさん！韓国へようこそ。","vi-VN":"Rất vui được gặp bạn, Kevin! Chào mừng bạn đến Hàn Quốc.","fr-FR":"Enchanté, Kevin ! Bienvenue en Corée.","de-DE":"Freut mich, Kevin! Willkommen in Korea.","es-ES":"¡Mucho gusto, Kevin! Bienvenido a Corea.","ru-RU":"Приятно познакомиться, Кевин! Добро пожаловать в Корею.","uk-UA":"Приємно познайомитися, Кевіне! Ласкаво просимо до Кореї.","it-IT":"Piacere di conoscerti, Kevin! Benvenuto in Corea.","zh-TW":"很高興認識你，Kevin！歡迎來到韓國。"}}],"practiceQuestion":{"prompt":"介紹自己「我是從香港來的」時，正確的韓語句子是？","options":["저는 홍콩에서 왔어요.","저는 홍콩에 가요.","홍콩이 어디예요?","홍콩은 얼마예요?"],"correctIndex":0,"explanation":"「［國家/城市］에서 왔어요 (-eseo wasseoyo)」意思是「從〜來的」。"},"i18nTitle":{"en-GB":"3. Self-Introduction (Name, Nationality, Travel)","th-TH":"3. การแนะนำตัว (ชื่อ สัญชาติ การท่องเที่ยว)","ja-JP":"3. 自己紹介（名前・出身・旅行）","vi-VN":"3. Tự giới thiệu (Tên, Quốc tịch, Du lịch)","fr-FR":"3. Se présenter (Nom, Nationalité, Voyage)","de-DE":"3. Selbstvorstellung (Name, Herkunft, Reise)","es-ES":"3. Presentación personal (Nombre, Nacionalidad, Viaje)","ru-RU":"3. Самопрезентация (Имя, Страна, Путешествие)","uk-UA":"3. Самопрезентація (Ім'я, Країна, Подорож)","it-IT":"3. Presentarsi (Nome, Nazionalità, Viaggio)","zh-TW":"3. 自我介紹（姓名、國籍、職業）"}},{"id":"conv_04_first_meeting","order":4,"title":"4. 初次見面與寒暄（請多指教）","category":"基礎社交","level":"入門 TOPIK I","situation":"在商務場合、語言交換或導覽團第一次與韓國人見面。","grammarNote":"「처음 뵙겠습니다 [처음 봽껟씀니다]」是初次見面最正式禮貌的問候語；接著說「만나서 반갑습니다（很高興見到您）」與「잘 부탁드립니다（請多多指教/關照）」。","formalVsInformal":"正式格式體：처음 뵙겠습니다. 잘 부탁드립니다.\n日常禮貌體：만나서 반가워요. 잘 부탁해요.","vocab":[{"kr":"처음 뵙겠습니다","actual":"[처음 봽껟씀니다]","romaji":"cheoeum boepgetseumnida","zh":"初次見面","i18n":{"en-GB":"cheoeum boepgetseumnida (初次見面)","th-TH":"cheoeum boepgetseumnida (初次見面)","ja-JP":"cheoeum boepgetseumnida (初次見面)","vi-VN":"cheoeum boepgetseumnida (初次見面)","fr-FR":"cheoeum boepgetseumnida (初次見面)","de-DE":"cheoeum boepgetseumnida (初次見面)","es-ES":"cheoeum boepgetseumnida (初次見面)","ru-RU":"cheoeum boepgetseumnida (初次見面)","uk-UA":"cheoeum boepgetseumnida (初次見面)","it-IT":"cheoeum boepgetseumnida (初次見面)","zh-TW":"初次見面"}},{"kr":"만나서 반갑습니다","actual":"[만나서 반갑씀니다]","romaji":"mannaseo bangapseumnida","zh":"很高興認識您","i18n":{"en-GB":"mannaseo bangapseumnida (很高興認識您)","th-TH":"mannaseo bangapseumnida (很高興認識您)","ja-JP":"mannaseo bangapseumnida (很高興認識您)","vi-VN":"mannaseo bangapseumnida (很高興認識您)","fr-FR":"mannaseo bangapseumnida (很高興認識您)","de-DE":"mannaseo bangapseumnida (很高興認識您)","es-ES":"mannaseo bangapseumnida (很高興認識您)","ru-RU":"mannaseo bangapseumnida (很高興認識您)","uk-UA":"mannaseo bangapseumnida (很高興認識您)","it-IT":"mannaseo bangapseumnida (很高興認識您)","zh-TW":"很高興認識您"}},{"kr":"잘 부탁드립니다","actual":"[잘 부탁뜨림니다]","romaji":"jal butakdeurimnida","zh":"請多多指教","i18n":{"en-GB":"jal butakdeurimnida (請多多指教)","th-TH":"jal butakdeurimnida (請多多指教)","ja-JP":"jal butakdeurimnida (請多多指教)","vi-VN":"jal butakdeurimnida (請多多指教)","fr-FR":"jal butakdeurimnida (請多多指教)","de-DE":"jal butakdeurimnida (請多多指教)","es-ES":"jal butakdeurimnida (請多多指教)","ru-RU":"jal butakdeurimnida (請多多指教)","uk-UA":"jal butakdeurimnida (請多多指教)","it-IT":"jal butakdeurimnida (請多多指教)","zh-TW":"請多多指教"}},{"kr":"성함","actual":"[성함]","romaji":"seongham","zh":"尊姓大名（이름 的敬語）","i18n":{"en-GB":"seongham (尊姓大名（이름 的敬語）)","th-TH":"seongham (尊姓大名（이름 的敬語）)","ja-JP":"seongham (尊姓大名（이름 的敬語）)","vi-VN":"seongham (尊姓大名（이름 的敬語）)","fr-FR":"seongham (尊姓大名（이름 的敬語）)","de-DE":"seongham (尊姓大名（이름 的敬語）)","es-ES":"seongham (尊姓大名（이름 的敬語）)","ru-RU":"seongham (尊姓大名（이름 的敬語）)","uk-UA":"seongham (尊姓大名（이름 的敬語）)","it-IT":"seongham (尊姓大名（이름 的敬語）)","zh-TW":"尊姓大名（이름 的敬語）"}}],"lines":[{"id":"c04_l1","speaker":"韓國導遊","kr":"처음 뵙겠습니다. 가이드 김민수입니다.","actual":"[처음 봽껟씀니다. 가이드 김민수임니다]","romaji":"Cheoeum boepgetseumnida. Gaideu Gim Minsu-imnida.","zh":"初次見面。我是導遊金敏秀。","note":"注意 입니다 鼻音化讀作 [임니다]。","i18n":{"en-GB":"How do you do (first time meeting). I am tour guide Kim Minsu.","th-TH":"ยินดีที่ได้พบเป็นครั้งแรก ผมชื่อคิมมินซู เป็นไกด์ครับ","ja-JP":"はじめまして。ガイドのキム・ミンスと申します。","vi-VN":"Hân hạnh được gặp lần đầu. Tôi là hướng dẫn viên Kim Minsu.","fr-FR":"Enchanté de vous rencontrer. Je suis le guide Kim Minsu.","de-DE":"Sehr erfreut. Ich bin Reiseleiter Kim Minsu.","es-ES":"Mucho gusto en conocerle. Soy el guía Kim Minsu.","ru-RU":"Рад первой встрече. Я гид Ким Минсу.","uk-UA":"Радий першій зустрічі. Я гід Кім Мінсу.","it-IT":"Molto lieto. Sono la guida Kim Minsu.","zh-TW":"初次見面。我是導遊金敏秀。"}},{"id":"c04_l2","speaker":"旅客","kr":"만나서 반갑습니다! 앞으로 잘 부탁드립니다.","actual":"[만나서 반갑씀니다! 아프로 잘 부탁뜨림니다]","romaji":"Mannaseo bangapseumnida! Apeuro jal butakdeurimnida.","zh":"很高興見到您！今後請多多指教。","note":"「앞으로」意為「今後、往後」。","i18n":{"en-GB":"Pleasure to meet you! I look forward to working with you.","th-TH":"ยินดีที่ได้รู้จักครับ/ค่ะ! ฝากเนื้อฝากตัวด้วยนะครับ/คะ","ja-JP":"お会いできて嬉しいです！これからよろしくお願いいたします。","vi-VN":"Rất vui được gặp anh! Từ nay về sau mong được giúp đỡ.","fr-FR":"Ravi de vous rencontrer ! Je compte sur votre bienveillance.","de-DE":"Freut mich sehr! Auf gute Zusammenarbeit.","es-ES":"¡Encantado de conocerle! Espero contar con su amable ayuda.","ru-RU":"Очень приятно познакомиться! Надеюсь на доброе сотрудничество.","uk-UA":"Дуже приємно познайомитися! Сподіваюся на добру співпрацю.","it-IT":"Piacere di conoscerla! Spero in una buona collaborazione.","zh-TW":"很高興見到您！今後請多多指教。"}},{"id":"c04_l3","speaker":"韓國導遊","kr":"네, 저야말로 잘 부탁드립니다.","actual":"[네, 저야말로 잘 부탁뜨림니다]","romaji":"Ne, jeoyamallo jal butakdeurimnida.","zh":"好的，我才要請您多多指教。","note":"「저야말로」相當於中文「我才要／彼此彼此」。","i18n":{"en-GB":"Yes, the pleasure is all mine.","th-TH":"เช่นกันครับ ฝากเนื้อฝากตัวด้วยเช่นกันครับ","ja-JP":"はい、こちらこそよろしくお願いいたします。","vi-VN":"Dạ, chính tôi mới là ngườiต้อง mong bạn giúp đỡ.","fr-FR":"C'est moi qui vous remercie d'avance.","de-DE":"Ganz meinerseits!","es-ES":"Igualmente, el gusto es mío.","ru-RU":"Да, взаимно, я тоже очень рад.","uk-UA":"Так, взаємно, я теж дуже радий.","it-IT":"Il piacere è tutto mio.","zh-TW":"好的，我才要請您多多指教。"}}],"practiceQuestion":{"prompt":"初次見面時想用正式禮貌的韓語說「初次見面」，應該說哪一句？","options":["처음 뵙겠습니다 (Cheoeum boepgetseumnida)","오랜만이에요 (Oraenman-ieyo)","다녀오겠습니다 (Danyeogetseumnida)","수고하셨습니다 (Sugohasyeotseumnida)"],"correctIndex":0,"explanation":"「처음 뵙겠습니다」意為「初次拜見／初次見面」；「오랜만이에요」則是好久不見。"},"i18nTitle":{"en-GB":"4. First Meeting & Polite Icebreakers","th-TH":"4. การพบกันครั้งแรกและฝากเนื้อฝากตัว","ja-JP":"4. 初対面の挨拶（はじめまして・よろしくお願いします）","vi-VN":"4. Lần đầu gặp mặt & Làm quen lịch sự","fr-FR":"4. Première rencontre et formules de politesse","de-DE":"4. Erstes Kennenlernen & Höflichkeitsformeln","es-ES":"4. Primer encuentro y cortesía","ru-RU":"4. Первое знакомство и вежливый этикет","uk-UA":"4. Перше знайомство та ввічливий етикет","it-IT":"4. Primo incontro e formule di cortesia","zh-TW":"4. 初次見面與寒暄（請多指教）"}},{"id":"conv_05_thanks_apology","order":5,"title":"5. 感謝、道歉與借過（잠시만요 vs 저기요）","category":"基礎社交","level":"旅遊核心","situation":"在擁擠的地鐵借過、在餐廳叫店員，或接受幫助時道謝。","grammarNote":"【韓國旅遊必知區別】在中文裡「不好意思」可以同時用來叫店員和借過，但韓語分得很清楚：① 在餐廳呼叫店員點餐：說「저기요! (Jeogiyo! 這裡요!)」或「사장님! (老闆!)」；② 在地鐵或街上跟人借過、請人讓一下：說「잠시만요! (Jamsimanyo! 請稍等/借過一下!)」；③ 不小心踩到或撞到別人道歉：說「죄송합니다 (Joesonghamnida 對不起)」。","formalVsInformal":"正式致謝/致歉：감사합니다 / 죄송합니다\n日常親切致謝/致歉：고마워요 / 미안해요","vocab":[{"kr":"잠시만요","actual":"[잠시만요]","romaji":"jamsimanyo","zh":"借過一下／請稍等一下","i18n":{ m getting off. Sorry.","th-TH":"ขอทางสักครู่นะครับ/คะ! ขอลงรถหน่อย ขอโทษครับ/ค่ะ","ja-JP":"すみません（ちょっと通してください）！降ります。申し訳ありません。","vi-VN":"Xin nhường đường một chút! Tôi xin xuống xe. Xin lỗi ạ.","fr-FR":"Excusez-moi un instant ! Je descends. Pardon.","de-DE":"Entschuldigung, einen Moment! Ich steige aus. Verzeihung.","es-ES":"¡Con permiso un momento! Voy a bajar. Disculpe.","ru-RU":"Извините, на секунду! Я выхожу. Простите.","uk-UA":"Перепрошую, на хвилинку! Я виходжу. Вибачте.","it-IT":"Permesso un attimo! Scendo. Mi scusi.","zh-TW":"借過一下！我要下車。不好意思。"}},{"id":"c05_l2","speaker":"韓國乘客","kr":"아, 네! 괜찮아요.","actual":"[아, 네! 괜차나요]","romaji":"A, ne! Gwaenchanayo.","zh":"啊，好的！沒關係。","note":"注意 괜찮아요 的 ㅎ 脫落讀作 [괜차나요]。","i18n":{"en-GB":"Oh, sure! It's totally fine.","th-TH":"อ๋อ ได้ครับ/ค่ะ! ไม่เป็นไรเลย","ja-JP":"あ、はい！大丈夫ですよ。","vi-VN":"À vâng! Không sao đâu ạ.","fr-FR":"Ah, oui ! Pas de problème.","de-DE":"Ach ja! Kein Problem.","es-ES":"¡Ah, sí! No pasa nada.","ru-RU":"А, да! Ничего страшного.","uk-UA":"А, так! Нічого страшного.","it-IT":"Ah, sì! Non c'è problema.","zh-TW":"啊，好的！沒關係。"}},{"id":"c05_l3","speaker":"旅客","kr":"도와주셔서 정말 감사합니다.","actual":"[도와주셔서 정말 감사함니다]","romaji":"Dowajusyeoseo jeongmal gamsahamnida.","zh":"非常感謝您的幫忙。","note":"韓國人回應「不客氣」時最自然常說「아니에요, 별말씀을요（哪裡，別客氣）」。","i18n":{"en-GB":"Thank you so much for helping me.","th-TH":"ขอบคุณมากจริงๆ ที่ช่วยเหลือครับ/ค่ะ","ja-JP":"助けていただいて本当にありがとうございます。","vi-VN":"Thực sự cảm ơn rất nhiều vì đã giúp đỡ tôi.","fr-FR":"Merci infiniment pour votre aide.","de-DE":"Vielen herzlichen Dank für Ihre Hilfe.","es-ES":"Muchas gracias de verdad por ayudarme.","ru-RU":"Большое вам спасибо за помощь.","uk-UA":"Щиро дякую вам за допомогу.","it-IT":"Grazie mille davvero per avermi aiutato.","zh-TW":"非常感謝您的幫忙。"}}],"practiceQuestion":{"prompt":"在擁擠的首爾地鐵車廂準備下車，想請門口的乘客「借過一下」，應該說哪一句？","options":["잠시만요! (Jamsimanyo!)","저기요, 주문할게요!","잘 먹겠습니다!","오랜만이에요!"],"correctIndex":0,"explanation":"借過或請對方稍等一下使用「잠시만요! (Jamsimanyo!)」。"},"i18nTitle":{"en-GB":"5. Excu an","zh":"結帳買單","i18n":{"en-GB":"gyesan (結帳買單)","th-TH":"gyesan (結帳買單)","ja-JP":"gyesan (結帳買單)","vi-VN":"gyesan (結帳買單)","fr-FR":"gyesan (結帳買單)","de-DE":"gyesan (結帳買單)","es-ES":"gyesan (結帳買單)","ru-RU":"gyesan (結帳買單)","uk-UA":"gyesan (結帳買單)","it-IT":"gyesan (結帳買單)","zh-TW":"結帳買單"}}],"lines":[{"id":"c06_l1","speaker":"店員","kr":"어서 오세요. 몇 분이세요?","actual":"[어서 오세요. 멷 뿌니세요]","romaji":"Eoseo oseyo. Myeot bun-iseyo?","zh":"歡迎光臨。請問幾位？","note":"店員使用敬語量詞「분 (位)」。","i18n":{"en-GB":"Welcome! How many people in your party?","th-TH":"ยินดีต้อนรับครับ/ค่ะ กี่ท่านครับ/คะ?","ja-JP":"いらっしゃいませ。何名様ですか？","vi-VN":"Chào mừng quý khách. Đi mấy người ạ?","fr-FR":"Bienvenue ! Vous êtes combien de personnes ?","de-DE":"Willkommen! Wie viele Personen sind Sie?","es-ES":"Bienvenido. ¿Cuántas personas son?","ru-RU":"Добро пожаловать. Сколько вас человек?","uk-UA":"Ласкаво просимо. Скільки вас осіб?","it-IT":"Benvenuti. In quanti siete?","zh-TW":"歡迎光臨。請問幾位？"}},{"id":"c06_l2","speaker":"旅客","kr":"두 명이에요. 저기요, 삼겹살 이 인분하고 비빔밥 하나 주세요.","actual":"[두 명이에요. 저기요, 삼겹쌀 이 인분하고 비빔빱 하나 주세요]","romaji":"Du myeong-ieyo. Jeogiyo, samgyeopsal i inbun-hago bibimbap hana juseyo.","zh":"兩個人。不好意思，請給我兩人份五花肉和一份拌飯。","note":"結合雙軌數字：人數用 두 명(固有)，人份用 이 인분(漢字)，單份用 하나(固有)！","i18n":{"en-GB":"Two people. Excuse me, two servings of pork belly and one bibimbap, please.","th-TH":"2 คนครับ/ค่ะ ขอโทษนะครับ ขอหมูสามชั้น 2 ที่ และบิบิมบับ 1 ที่ครับ","ja-JP":"2人です。すみません、サムギョプサル2人前とビビンバを1つください。","vi-VN":"Hai người ạ. Cho tôi gọi 2 phần thịt ba chỉ nướng và 1 phần cơm trộn.","fr-FR":"Deux personnes. S'il vous plaît, deux portions de poitrine de porc et un bibimbap.","de-DE":"Zwei Personen. Entschuldigung, bitte zwei Portionen Samgyeopsal und einmal Bibimbap.","es-ES":"Dos personas. Disculpe, dos raciones de panceta y un bibimbap, por favor.","ru-RU":"Двое. Извините, две порции самгёпсаля и один пибимпап, пожалуйста.","uk-UA":"Двоє. Перепрошую, дві порції самгьопсалю та один пібімпап, будь ласка.","it-IT":"Due persone. Mi scusi, due porzioni di samgyeopsal e un bibimbap, per favore.","zh-TW":"兩個人。不好意思，請給我兩人份五花肉和一份拌飯。"}},{"id":"c06_l3","speaker":"旅客","kr":"김치하고 물 좀 더 주세요. 잘 먹겠습니다!","actual":"[김치하고 물 쫌 더 주세요. 잘 먹껟씀니다]","romaji":"Gimchi-hago mul jom deo juseyo. Jal meokgetseumnida!","zh":"請再給我一點泡菜和水。我開動了！","note":"「좀 더 주세요」＝「請再多給一點」。","i18n":{"en-GB":"Please give us some more kimchi and water. Thanks for the meal (before eating)!","th-TH":"ขอกิมจิและน้ำเพิ่มหน่อยครับ/ค่ะ จะทานแล้วนะครับ/คะ!","ja-JP":"キムチとお水をもう少しください。いただきます！","vi-VN":"Cho tôi xin thêm một ít kim chi và nước. Chúc ngon miệng!","fr-FR":"Un peu plus de kimchi et d'eau, s'il vous plaît. Bon appétit !","de-DE":"Bitte noch etwas Kimchi und Wasser. Guten Appetit!","es-ES":"Más kimchi y agua, por favor. ¡Buen provecho!","ru-RU":"Дайте ещё немного кимчи и воды, пожалуйста. Приятного аппетита!","uk-UA":"Дайте ще трохи кімчі та води, будь ласка. Смачного!","it-IT":"Un altro po' di kimchi e acqua, per favore. Buon appetito!","zh-TW":"請再給我一點泡菜和水。我開動了！"}},{"id":"c06_l4","speaker":"旅客","kr":"잘 먹었습니다. 여기 계산해 주세요. 카드로 할게요.","actual":"[잘 머걷씀니다. 여기 계산해 주세요. 카드로 할께요]","romaji":"Jal meogeotseumnida. Yeogi gyesanhae juseyo. Kadeu-ro halgeyo.","zh":"多謝款待。這裡麻煩結帳，我要刷卡。","note":"「카드로 할게요」＝「我要用信用卡付」。","i18n":{"en-GB":"That was delicious. Check here, please. I'll pay by card.","th-TH":"ทานอิ่มอร่อยมากครับ/ค่ะ คิดเงินด้วยครับ ขอจ่ายด้วยบัตร","ja-JP":"ごちそうさまでした。ここでお会計をお願いします。カードで払います。","vi-VN":"Tôi ăn rất ngon miệng. Làm ơn tính tiền. Tôi sẽ trả bằng thẻ.","fr-FR":"C'était délicieux. L'addition s'il vous plaît. Je paie par carte.","de-DE":"Es hat sehr gut geschmeckt. Bitte zahlen. Ich zahle mit Karte.","es-ES":"Estuvo muy rico. La cuenta, por favor. Pagaré con tarjeta.","ru-RU":"Было очень вкусно. Посчитайте, пожалуйста. Я оплачу картой.","uk-UA":"Було дуже смачно. Порахуйте, будь ласка. Я оплачу карткою.","it-IT":"Era tutto ottimo. Il conto, per favore. Pago con la carta.","zh-TW":"多謝款待。這裡麻煩結帳，我要刷卡。"}}],"practiceQuestion":{"prompt":"在韓國餐廳想請店員「再給我一點泡菜（續小菜）」，應該怎麼說？","op r-FR":"Je suis allergique aux crevettes. Veuillez retirer les crevettes.","de-DE":"Ich habe eine Garnelenallergie. Bitte lassen Sie die Garnelen weg.","es-ES":"Tengo alergia a las gambas. Por favor, no le ponga gambas.","ru-RU":"У меня аллергия на креветки. Пожалуйста, уберите креветки.","uk-UA":"У мене алергія на креветки. Будь ласка, не додавайте креветки.","it-IT":"Sono allergico ai gamberetti. Per favore, tolga i gamberetti.","zh-TW":"我對蝦子過敏。請不要加蝦子。"}},{"id":"c13_l3","speaker":"店員","kr":"네, 알겠습니다. 안 맵고 새우 없이 만들어 드릴게요.","actual":"[네, 알껟씀니다. 안 맵꼬 새우 업씨 만드러 드릴께요]","romaji":"Ne, algetseumnida. An maepgo saeu eopsi mandeureo deurilgeyo.","zh":"好的，我知道了。我會幫您做成不辣且不加蝦子。","note":"없이 [업씨]＝沒有〜地。","i18n":{"en-GB":"Yes, understood. I will prepare it non-spicy and without shrimp.","th-TH":"เข้าใจแล้วครับ/ค่ะ จะทำแบบไม่เผ็ดและไม่ใส่กุ้งให้ครับ","ja-JP":"はい、かしこまりました。辛くなく、エビ抜きでお作りします。","vi-VN":"Vâng, tôi hiểu rồi. Tôi sẽ làm không cay và không có tôm cho quý khách.","fr-FR":"Oui, bien compris. Je vais le préparer sans piment et sans crevettes.","de-DE":"Ja, verstanden. Ich bereite es nicht scharf und ohne Garnelen zu.","es-ES":"Sí, entendido. Se lo prepararé sin picante y sin gambas.","ru-RU":"Да, понял. Мы приготовим не острым и без креветок.","uk-UA":"Так, зрозуміло. Ми приготуємо не гострим і без креветок.","it-IT":"Sì, ho capito. Glielo preparo non piccante e senza gamberetti.","zh-TW":"好的，我知道了。我會幫您做成不辣且不加蝦子。"}}],"practiceQuestion":{"prompt":"在韓國點餐時怕太辣，想請店員「請幫我做比較不辣（微辣）」，應該說哪一句？","options":["덜 맵게 해 주세요 (Deol maepge hae juseyo)","아주 맵게 해 주세요 (Aju maepge hae juseyo)","소금을 더 넣어 주세요","빨리 주세요"],"correctIndex":0,"explanation":"「덜 맵게 해 주세요」意為「請做得沒那麼辣（微辣）」；「아주 맵게」則是超級辣。"},"i18nTitle":{"en-GB":"13. Dietary Needs (Less Spicy & Food Allergies)","th-TH":"13. ข้อจำกัดด้านอาหาร (เผ็ดน้อย และแพ้อาหาร)","ja-JP":"13. 食事の好み・辛さ調整・アレルギーを伝える","vi-VN":"13. Yêu cầu ăn uống (Ít cay & Dị ứng thực phẩm)","fr-FR":"13. Préférences alimentaires (Moins épicé et allergies)","de-DE":"13. Essenswünsche (Weniger scharf & Allergien)","es-ES":"13. Preferencias alimentarias (Menos picante y alergias)","ru-RU":"13. Пожелания к еде (Не острое и пищевая аллергия)","uk-UA":"13. Побажання до їжі (Не гостре та харчова алергія)","it-IT":"13. Esigenze alimentari (Meno piccante e allergie)","zh-TW":"13. 表達喜好、需求與飲食忌口（不吃辣／不吃牛／過敏）"}},{"id":"conv_14_speak_slower","order":14,"title":"14. 請對方說慢一點（천천히 말씀해 주세요）","category":"溝通應變","level":"旅遊必備","situation":"當韓國店員或路人語速太快時，禮貌請對方放慢說話速度。","grammarNote":"「천천히 (cheoncheonhi)」意思是「慢慢地」；「말씀하다」是說話（말하다）的敬語。合起來「천천히 말씀해 주세요」就是「請慢慢地說」。","formalVsInformal":"對店員/陌生人（敬語）：좀 천천히 말씀해 주세요.\n對朋友（平語）：천천히 말해 줘.","vocab":[{"kr":"천천히","actual":"[천천히]","romaji":"cheoncheonhi","zh":"慢慢地","i18n":{"en-GB":"cheoncheonhi (慢慢地)","th-TH":"cheoncheonhi (慢慢地)","ja-JP":"cheoncheonhi (慢慢地)","vi-VN":"cheoncheonhi (慢慢地)","fr-FR":"cheoncheonhi (慢慢地)","de-DE":"cheoncheonhi (慢慢地)","es-ES":"cheoncheonhi (慢慢地)","ru-RU":"cheoncheonhi (慢慢地)","uk-UA":"cheoncheonhi (慢慢地)","it-IT":"cheoncheonhi (慢慢地)","zh-TW":"慢慢地"}},{"kr":"조금만","actual":"[조금만]","romaji":"jogeumman","zh":"稍微／一點點","i18n":{"en-GB":"jogeumman (稍微／一點點)","th-TH":"jogeumman (稍微／一點點)","ja-JP":"jogeumman (稍微／一點點)","vi-VN":"jogeumman (稍微／一點點)","fr-FR":"jogeumman (稍微／一點點)","de-DE":"jogeumman (稍微／一點點)","es-ES":"jogeumman (稍微／一點點)","ru-RU":"jogeumman (稍微／一點點)","uk-UA":"jogeumman (稍微／一點點)","it-IT":"jogeumman (稍微／一點點)","zh-TW":"稍微／一點點"}},{"kr":"말씀하다","actual":"[말씀하다]","romaji":"malsseumhada","zh":"說話（敬語）","i18n":{"en-GB":"malsseumhada (說話（敬語）)","th-TH":"malsseumhada (說話（敬語）)","ja-JP":"malsseumhada (說話（敬語）)","vi-VN":"malsseumhada (說話（敬語）)","fr-FR":"malsseumhada (說話（敬語）)","de-DE":"malsseumhada (說話（敬語）)","es-ES":"malsseumhada (說話（敬語）)","ru-RU":"malsseumhada (說話（敬語）)","uk-UA":"malsseumhada (說話（敬語）)","it-IT":"malsseumhada (說話（敬語）)","zh-TW":"說話（敬語）"}},{"kr":"외국인","actual":"[웨구긴]","romaji":"oegugin","zh":"外國人","i18n":{"en-GB":"oegugin (外國人)","th-TH":"oegugin (外國人)","ja-JP":"oegugin (外國人)","vi-VN":"oegugin (外國人)","fr-FR":"oegugin (外國人)","de-DE":"oegugin (外國人)","es-ES":"oegugin (外國人)","ru-RU":"oegugin (外國人)","uk-UA":"oegugin (外國人)","it-IT":"oegugin (外國人)","zh-TW":"外國人"}}],"lines":[{"id":"c14_l1","speaker":"旅客","kr":"죄송합니다, 저는 외국인이에요. 한국어를 조금밖에 못해요.","actual":"[줴송함니다, 저는 웨구기니에요. 한구거를 조금바께 모태요]","romaji":"Joesonghamnida, jeoneun oegugin-ieyo. Hangugeo-reul jogeumbakke mothaeyo.","zh":"不好意思，我是外國人。我只會說一點點韓語。","note":"조금밖에 못해요＝只會一點點。","i18n":{"en-GB":"I'm sorry, I am a foreigner. I only speak a little Korean.","th-TH":"ขอโทษครับ/ค่ะ ฉันเป็นชาวต่างชาติ พูดภาษาเกาหลีได้นิดเดียว","ja-JP":"すみません、私は外国人です。韓国語は少ししか話せません。","vi-VN":"Xin lỗi, tôi là người nước ngoài. Tôi chỉ nói được một chút tiếng Hàn.","fr-FR":"Désolé, je suis étranger. Je ne parle qu'un tout petit peu coréen.","de-DE":"Entschuldigung, ich bin Ausländer. Ich spreche nur ein wenig Koreanisch.","es-ES":"Lo siento, soy extranjero. Solo hablo un poquito de coreano.","ru-RU":"Извините, я иностранец. Я говорю по-корейски совсем немного.","uk-UA":"Перепрошую, я іноземець. Я розмовляю корейською зовсім небагато.","it-IT":"Mi scusi, sono straniero. Parlo solo un pochino di coreano.","zh-TW":"不好意思，我是外國人。我只會說一點點韓語。"}},{"id":"c14_l2","speaker":"旅客","kr":"조금만 천천히 말씀해 주시겠어요?","actual":"[조금만 천천히 말쓰매 주시게써요]","romaji":"Jogeumman cheoncheonhi malsseumhae jusigesseoyo?","zh":"可以請您稍微說慢一點嗎？","note":"旅遊最實用的緩衝神句！","i18n":{"en-GB":"Could you please speak a little more slowly?","th-TH":"ช่วยพูดช้าลงสักนิดได้ไหมครับ/คะ?","ja-JP":"もう少しだけゆっくり話していただけますか？","vi-VN":"Xin vui lòng nói chậm lại một chút được không ạ?","fr-FR":"Pourriez-vous parler un peu plus lentement, s'il vous plaît ?","de-DE":"Könnten Sie bitte etwas langsamer sprechen?","es-ES":"¿Podría hablar un poco más despacio, por favor?","ru-RU":"Не могли бы вы говорить немного помедленнее?","uk-UA":"Чи не могли б ви говорити трохи повільніше?","it-IT":"Potrebbe parlare un po' più lentamente, per favore?","zh-TW":"可以請您稍微說慢一點嗎？"}},{"id":"c14_l3","speaker":"韓國店員","kr":"아, 네! 천천히 설명해 드릴게요.","actual":"[아, 네! 천천히 설명해 드릴께요]","romaji":"A, ne! Cheoncheonhi seolmyeonghae deurilgeyo.","zh":"啊，好的！我慢慢向您說明。","note":"설명하다＝說明、解釋。","i18n":{"en-GB":"Oh, sure! I will explain it to you slowly.","th-TH":"อ๋อ ได้เลยครับ/ค่ะ! เดี๋ยวจะอธิบายให้ฟังช้าๆ นะ","ja-JP":"あ、はい！ゆっくりご説明しますね。","vi-VN":"À vâng! Tôi sẽ giải thích chậm rãi cho bạn nhé.","fr-FR":"Ah, bien sûr ! Je vais vous expliquer lentement.","de-DE":"Ach ja! Ich werde es Ihnen langsam erklären.","es-ES":"¡Ah, claro! Se lo explicaré despacio.","ru-RU":"А, конечно! Я объясню вам медленно.","uk-UA":"А, звісно! Я поясню вам повільно.","it-IT":"Ah, certo! Glielo spiegherò lentamente.","zh-TW":"啊，好的！我慢慢向您說明。"}}],"practiceQuestion":{"prompt":"想請韓國人「請說慢一點」，最關鍵的副詞「慢慢地」韓文是？","options":["천천히 (cheoncheonhi)","빨리 (ppalli)","많이 (mani)","같이 (gachi)"],"correctIndex":0,"explanation":"「천천히 (cheoncheonhi)」是慢慢地；「빨리」是快一點，「많이」是很多，「같이」是一起。"},"i18nTitle":{"en-GB":"14. Asking Someone to Speak More Slowly (천천히)","th-TH":"14. ขอให้อีกฝ่ายพูดช้าลงหน่อย (천천히)","ja-JP":"14. もう少しゆっくり話してもらう（천천히）","vi-VN":"14. Nhờ đối phương nói chậm lại một chút (천천히)","fr-FR":"14. Demander de parler plus lentement (천천히)","de-DE":"14. Bitten, langsamer zu sprechen (천천히)","es-ES":"14. Pedir que hablen más despacio (천천히)","ru-RU":"14. Просьба говорить помедленнее (천천히)","uk-UA":"14. Прохання говорити повільніше (천천히)","it-IT":"14. Chiedere di parlare più lentamente (천천히)","zh-TW":"14. 請對方說慢一點（천천히 말씀해 주세요）"}},{"id":"conv_15_dont_understand","order":15,"title":"15. 表示聽不懂韓語與請求中文／英文協助","category":"溝通應變","level":"旅遊必備","situation":"聽不懂對方的韓語說明，或詢問是否有會說中文／英文的人員及翻譯工具。","grammarNote":"「잘 모르겠어요 (jal moreugesseoyo)」＝「我不太清楚／不太明白」；「못 알아들었어요 [모 다라드러써요]」＝「我沒聽懂」。詢問能否用某語言溝通：「중국어/영어 할 수 있어요?」。","formalVsInformal":"標準禮貌：잘 모르겠어요. / 중국어 할 수 있는 직원 있어요?","vocab":[{"kr":"잘 모르겠어요","actual":"[잘 모르게써요]","romaji":"jal moreugesseoyo","zh":"我不太清楚／不太懂","i18n":{"en-GB":"jal moreugesseoyo (我不太清楚／不太懂)","th-TH":"jal moreugesseoyo (我不太清楚／不太懂)","ja-JP":"jal moreugesseoyo (我不太清楚／不太懂)","vi-VN":"jal moreugesseoyo (我不太清楚／不太懂)","fr-FR":"jal m     const STORAGE_KEY = "ksbs_intl_progress_v1";

    // Application State (persisted in localStorage)
    let state = {
      lang: "en-GB",
      mainTab: "hangul",
      subTab: "jamo",
      speed: 0.35,
      toggles: {
        romaji: true,
        nativePron: true,
        actualPron: true,
        translation: true,
        pronNotes: true
      },
      preset: "beginner",
      combInit: 0,
      combMed: 0,
      combFin: 0,
      writeChar: "한",
      showWriteGuide: true,
      selectedNumCat: "num_native_basic",
      selectedCounter: "cnt_01_gae",
      selectedConv: "conv_01_basic_greetings",
      quizMode: "all",
      quizIdx: 0,
      quizSelected: null,
      quizSubmitted: false,
      progress: {
        itemStatus: {}, // id -> 'mastered' | 'review' | 'learning'
        reviewCounts: {}, // id -> number
        quizCorrect: 0,
        quizTotal: 0,
        wrongQuizIds: []
      }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.lang && DATA.supportedLocales[parsed.lang]) state.lang = parsed.lang;
          if (parsed.toggles) state.toggles = Object.assign(state.toggles, parsed.toggles);
          if (parsed.progress) state.progress = Object.assign(state.progress, parsed.progress);
          if (parsed.speed) state.speed = parsed.speed;
        } else {
          // Auto-detect browser locale on first visit, fallback to en-GB
          const navLang = (navigator.language || "en-GB");
          const matched = Object.keys(DATA.supportedLocales).find(k => k.toLowerCase() === navLang.toLowerCase() || k.split('-')[0] === navLang.split('-')[0]);
          state.lang = matched || "en-GB";
        }
      } catch (e) {
        state.lang = "en-GB";
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          lang: state.lang,
          toggles: state.toggles,
          progress: state.progress,
          speed: state.speed
        }));
      } catch (e) {}
    }

    function t(key) {
      const dict = DATA.uiStrings[state.lang] || DATA.uiStrings["en-GB"];
      return dict[key] || DATA.uiStrings["en-GB"][key] || key;
    }

    function speakKorean(text, customRate) {
      const rate = customRate || state.speed || 0.35;
      const clean = (text || "").replace(/\[.*?\]/g, "").split("/")[0].trim();
      if (!clean) return;
      state.progress.reviewCounts[clean] = (state.progress.reviewCounts[clean] || 0) + 1;
      saveState();
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = "ko-KR";
          u.rate = rate;
          const voices = window.speechSynthesis.getVoices();
          const koVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes("ko"));
          if (koVoice) u.voice = koVoice;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }
    }

    const HANGUL_INIT = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const HANGUL_MED = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const HANGUL_FIN = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const BAT_REP_JS = {'':'','ㄱ':'k','ㄲ':'k','ㄳ':'k','ㅋ':'k','ㄺ':'k','ㄴ':'n','ㄵ':'n','ㄶ':'n','ㄷ':'t','ㅅ':'t','ㅆ':'t','ㅈ':'t','ㅊ':'t','ㅌ':'t','ㅎ':'t','ㄹ':'l','ㄼ':'l','ㄽ':'l','ㄾ':'l','ㅀ':'l','ㅁ':'m','ㄻ':'m','ㅂ':'p','ㅍ':'p','ㅄ':'p','ㄿ':'p','ㅇ':'ng'};

    function computeNativePronJS(hangulStr, actualStr, lang) {
      let src = hangulStr || "";
      if (actualStr) {
        const m = actualStr.match(/\[([가-힣\s/·,\?!]+)\]/);
        if (m && m[1]) src = m[1].split('/')[0].trim();
      }
      const words = src.split(/\s+/);
      const outWords = [];
      for (const w of words) {
        const syls = [];
        let first = true;
        for (const ch of w) {
          const code = ch.charCodeAt(0);
          if (code >= 0xAC00 && code <= 0xD7A3) {
            const off = code - 0xAC00;
            const ic = HANGUL_INIT[Math.floor(off / 588)];
            const mv = HANGUL_MED[Math.floor((off % 588) / 28)];
            const fc = HANGUL_FIN[off % 28];
            const br = BAT_REP_JS[fc] || '';
            syls.push(sylToLangJS(ic, mv, br, first, lang));
            first = false;
          }
        }
        if (syls.length) outWords.push(syls.join(lang === 'ja-JP' ? '' : '-'));
      }
      return outWords.join(' ') || src;
    }

    function sylToLangJS(ic, mv, br, first, lang) {
      if (lang === 'th-TH') {
        const im = {'ㄱ':first?'ค':'ก','ㄲ':'กก','ㄴ':'น','ㄷ':first?'ท':'ด','ㄸ':'ตต','ㄹ':'ร','ㅁ':'ม','ㅂ':first?'พ':'บ','ㅃ':'ปป','ㅅ':'ซ','ㅆ':'ซซ','ㅇ':'อ','ㅈ':first?'ช':'จ','ㅉ':'จจ','ㅊ':'ช','ㅋ':'ค','ㅌ':'ท','ㅍ':'พ','ㅎ':'ฮ'}[ic] || 'อ';
        const fm = {'':'','k':'ก','n':'น','t':'ด','l':'ล','m':'ม','p':'บ','ng':'ง'}[br] || '';
        const vm = {'ㅏ':fm?'ั':'า','ㅐ':'แ','ㅑ':'ยา','ㅒ':'แย','ㅓ':'อ','ㅔ':'เ','ㅕ':'ยอ','ㅖ':'เย','ㅗ':'โ','ㅘ':'วา','ㅙ':'แว','ㅚ':'เว','ㅛ':'โย','ㅜ':'ู','ㅝ':'วอ','ㅞ':'เว','ㅟ':'วี','ㅠ':'ยู','ㅡ':'ือ','ㅢ':'ึย','ㅣ':'ี'}[mv] || 'า';
        if (mv === 'ㅐ' || mv === 'ㅔ' || mv === 'ㅗ') return vm + im + fm;
        return im + vm + fm;
      }
      if (lang === 'ja-JP') {
        const im = {'ㄱ':first?'カ':'ガ','ㄲ':'ッカ','ㄴ':'ナ','ㄷ':first?'タ':'ダ','ㄸ':'ッタ','ㄹ':'ラ','ㅁ':'マ','ㅂ':first?'パ':'バ','ㅃ':'ッパ','ㅅ':'サ','ㅆ':'ッサ','ㅇ':'ア','ㅈ':first?'チャ':'ジャ','ㅉ':'ッチャ','ㅊ':'チャ','ㅋ':'カ','ㅌ':'タ','ㅍ':'パ','ㅎ':'ハ'}[ic] || 'ア';
        const fm = {'':'','k':'ク','n':'ン','t':'ッ','l':'ル','m':'ム','p':'プ','ng':'ン'}[br] || '';
        return im + fm;
      }
      if (lang === 'ru-RU') {
        const im = {'ㄱ':first?'к':'г','ㄲ':'кк','ㄴ':'н','ㄷ':first?'т':'д','ㄸ':'тт','ㄹ':'р','ㅁ':'м','ㅂ':first?'п':'б','ㅃ':'пп','ㅅ':'с','ㅆ':'сс','ㅇ':'','ㅈ':first?'чж':'дж','ㅉ':'чч','ㅊ':'чх','ㅋ':'кх','ㅌ':'тх','ㅍ':'пх','ㅎ':'х'}[ic] || '';
        const vm = {'ㅏ':'а','ㅐ':'э','ㅑ':'я','ㅒ':'йэ','ㅓ':'о','ㅔ':'е','ㅕ':'ё','ㅖ':'йе','ㅗ':'о','ㅘ':'ва','ㅙ':'вэ','ㅚ':'ве','ㅛ':'ё','ㅜ':'у','ㅝ':'во','ㅞ':'ве','ㅟ':'ви','ㅠ':'ю','ㅡ':'ы','ㅢ':'ый','ㅣ':'и'}[mv] || 'а';
        const fm = {'':'','k':'к','n':'н','t':'т','l':'ль','m':'м','p':'п','ng':'н'}[br] || '';
        return im + vm + fm;
      }
      if (lang === 'uk-UA') {
        const im = {'ㄱ':first?'к':'ґ','ㄲ':'кк','ㄴ':'н','ㄷ':first?'т':'д','ㄸ':'тт','ㄹ':'р','ㅁ':'м','ㅂ':first?'п':'б','ㅃ':'пп','ㅅ':'с','ㅆ':'сс','ㅇ':'','ㅈ':first?'чж':'дж','ㅉ':'чч','ㅊ':'чх','ㅋ':'кх','ㅌ':'тх','ㅍ':'пх','ㅎ':'х'}[ic] || '';
        const vm = {'ㅏ':'а','ㅐ':'е','ㅑ':'я','ㅒ':'є','ㅓ':'о','ㅔ':'е','ㅕ':'ьо','ㅖ':'є','ㅗ':'о','ㅘ':'ва','ㅙ':'ве','ㅚ':'ве','ㅛ':'йо','ㅜ':'у','ㅝ':'во','ㅞ':'ве','ㅟ':'ві','ㅠ':'ю','ㅡ':'и','ㅢ':'ий','ㅣ':'і'}[mv] || 'а';
        const fm = {'':'','k':'к','n':'н','t':'т','l':'ль','m':'м','p':'п','ng':'нґ'}[br] || '';
        return im + vm + fm;
      }
      const im = {'ㄱ':first?'k':'g','ㄲ':'kk','ㄴ':'n','ㄷ':first?'t':'d','ㄸ':'tt','ㄹ':'r','ㅁ':'m','ㅂ':first?'p':'b','ㅃ':'pp','ㅅ':'s','ㅆ':'ss','ㅇ':'','ㅈ':first?'ch':'j','ㅉ':'jj','ㅊ':'ch','ㅋ':'kh','ㅌ':'th','ㅍ':'ph','ㅎ':lang==='es-ES'?'j':'h'}[ic] || '';
      const vm = {'ㅏ':'a','ㅐ':'e','ㅑ':'ya','ㅒ':'ye','ㅓ':lang==='en-GB'?'uh':'o','ㅔ':'e','ㅕ':'yeo','ㅖ':'ye','ㅗ':'o','ㅘ':'wa','ㅙ':'we','ㅚ':'we','ㅛ':'yo','ㅜ':lang==='fr-FR'?'ou':'u','ㅝ':'wo','ㅞ':'we','ㅟ':'wi','ㅠ':'yu','ㅡ':lang==='vi-VN'?'ư':(lang==='de-DE'?'ü':'eu'),'ㅢ':'ui','ㅣ':'i'}[mv] || 'a';
      const fm = {'':'','k':'k','n':'n','t':'t','l':'l','m':'m','p':'p','ng':'ng'}[br] || '';
      return im + vm + fm;
    }

    function renderPronLayers(opts) {
      // opts: { romaji, nativePronMap, actualPron, translation, note }
      let html = `<div class="pron-layers">`;
      if (state.toggles.romaji && opts.romaji) {
        html += `<div class="layer-romaji">🔤 ${opts.romaji}</div>`;
      }
      const resolvedNativeMap = opts.nativePronMap || (opts.hangul ? computeNativePronJS(opts.hangul, opts.actualPron, state.lang) : null);
      if (state.toggles.nativePron && resolvedNativeMap) {
        const np = (typeof resolvedNativeMap === "object") ? (resolvedNativeMap[state.lang] || resolvedNativeMap["en-GB"]) : resolvedNativeMap;
        if (np) html += `<div class="layer-native">🗣️ [${DATA.supportedLocales[state.lang].nativeName}] ${np}</div>`;
      }
      if (state.toggles.actualPron && opts.actualPron) {
        html += `<div class="layer-actual">🎯 ${t("labelActualPron")}: ${opts.actualPron}</div>`;
      }
      if (state.toggles.translation && opts.translation) {
        html += `<div class="layer-trans">💡 ${opts.translation}</div>`;
      }
      if (state.toggles.pronNotes && opts.note) {
        html += `<div class="layer-note">📌 ${opts.note}</div>`;
      }
      html += `</div>`;
      return html;
    }

    function renderAudioAndSrsRow(hangulText, itemId) {

          <button class="btn-audio alt" onclick="speakKorean('${safeKr}', 0.45)">🏃 0.45x</button>

            <button class="btn-srs ${st==='mastered'?'active-mastered':''}" onclick="toggleItemStatus('${itemId}','mastered')">${t("btnMarkMastered")}</button>

          ` : ''}
        </div>
      `;
    }

    function switchMainTab(tabId, defaultSub) {
      state.mainTab = tabId;
      if (defaultSub) state.subTab = defaultSub;
      renderAll();
    }

    function switchSubTab(subId) {
      state.subTab = subId;
      renderAll();
    }

    function renderContent() {
      const root = document.getElementById("viewRoot");
      if (state.mainTab === "hangul") {
        if (state.subTab === "jamo") root.innerHTML = renderJamoGrid();
        else if (state.subTab === "triplets") root.innerHTML = renderTriplets();
        else if (state.subTab === "combiner") root.innerHTML = renderCombiner();
        else if (state.subTab === "batchim") root.innerHTML = renderBatchim();
        else if (state.subTab === "phono") root.innerHTML = renderPhono();
        else if (state.subTab === "writing") {
          root.innerHTML = renderWriting();
          setTimeout(initWriteCanvas, 30);
        }
      } else if (state.mainTab === "numbers") {
        if (state.subTab === "numCats") root.innerHTML = renderNumberCategories();
        else if (state.subTab === "counters") root.innerHTML = renderCounters();
        else root.innerHTML = renderNumComparison();
      } else if (state.mainTab === "conv") {
        root.innerHTML = renderConversations();
      } else if (state.mainTab === "quiz") {
        root.innerHTML = renderQuiz();
      } else if (state.mainTab === "stats") {
        root.innerHTML = renderStats();
      }
    }

    const CHOSEONG_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const JUNGSEONG_LIST = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JONGSEONG_LIST = ['(None)','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const INIT_ROM = ['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
    const MED_ROM = ['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
    const FIN_ROM = ['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];

    function renderCombiner() {
      const code = ((state.combInit * 21) + state.combMed) * 28 + state.combFin + 0xAC00;
      const char = String.fromCharCode(code);
      const rom = (INIT_ROM[state.combInit] + MED_ROM[state.combMed] + FIN_ROM[state.combFin]) || "a";
      const initCh = CHOSEONG_LIST[state.combInit];
      const medCh = JUNGSEONG_LIST[state.combMed];
      const finCh = state.combFin === 0 ? "—" : JONGSEONG_LIST[state.combFin];
      return `
        <div class="combiner-box">
          <h2 style="margin-bottom:6px;">${t("combinerTitle")}</h2>
          <p style="font-size:0.88rem;color:var(--text-muted);margin-bottom:14px;">${t("combinerDesc")}</p>

            <div>
              <div style="font-size:1.1rem;font-weight:800;">${initCh} + ${medCh} ${state.combFin ? '+ ' + finCh : ''} = ${char}</div>

          </div>
          <div><strong>2. Medial Vowel (중성 Jungseong):</strong></div>
          <div class="jamo-picker">
            ${JUNGSEONG_LIST.map((c, idx) => `<button class="jamo-btn ${state.combMed===idx?'active':''}" onclick="state.combMed=${idx};renderContent()">${c}</button>`).join("")}
          </div>
          <div><strong>3. Final Batchim Consonant (종성 Jongseong):</strong></div>
          <div class="jamo-picker">
            ${JONGSEONG_LIST.map((c, idx) => `<button class="jamo-btn ${state.combFin===idx?'active':''}" onclick="state.combFin=${idx};renderContent()">${c}</button>`).join("")}
          </div>

                  nativePronMap: ex.nativePron,
                  actualPron: ex.actual,
                  translation: ex.i18n ? ex.i18n[state.lang] : ex.zh
                })}
              </div>
            `).join("")}
          </div>
        `;
      }).join("") + `</div>`;
    }

    function renderPhono() {
      return `<div class="grid-cards">` + DATA.phonologicalRules.map(p => {
        const loc = p.i18n[state.lang] || p.i18n["en-GB"];
        return `
          <div class="card">
            <div class="hangul-md">${loc.title}</div>
            ${state.toggles.pronNotes ? `<div style="font-size:0.84rem;color:var(--text-muted);">${loc.explanation}</div>` : ''}
            ${p.examples.map(ex => `
              <div style="padding:8px;background:var(--surface-alt);border-radius:8px;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <span class="hangul-md">${ex.written} → ${ex.actual}</span>
                  <button class="btn-audio" onclick="speakKorean('${ex.written}')">🔊</button>
                </div>
                ${renderPronLayers({
                  hangul: ex.word || ex.written, romaji: ex.romaji,
                  nativePronMap: ex.nativePron,
                  actualPron: ex.actual,
                  translation: ex.i18n ? ex.i18n[state.lang] : ex.zh
                })}
              </div>
            `).join("")}
          </div>
        `;
      }).join("") + `</div>`;
    }

    function renderWriting() {
      const practiceChars = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅎ","가","나","다","한","글","사","랑"];
      return `
        <div class="combiner-box">
          <h2>✍️ ${t("subWriting")}</h2>
          <div class="jamo-picker">
            ${practiceChars.map(c => `<button class="jamo-btn ${state.writeChar===c?'active':''}" onclick="state.writeChar='${c}';renderContent();setTimeout(initWriteCanvas,30)">${c}</button>`).join("")}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center;">
            <canvas id="writeCanvas" width="280" height="280"></canvas>
            <div style="display:flex;flex-direction:column;gap:10px;">
              <div class="hangul-lg">${state.writeChar}</div>
              <button class="btn-audio" onclick="speakKorean('${state.writeChar}')">🔊 ${t("btnListen")}</button>
              <button class="preset-btn" onclick="state.showWriteGuide=!state.showWriteGuide;initWriteCanvas()">${t("writingGuideToggle")}</button>
              <button class="preset-btn" onclick="initWriteCanvas()">${t("writingClear")}</button>
            </div>
          </div>
        </div>
      `;
    }

    function initWriteCanvas() {
      const cvs = document.getElementById("writeCanvas");
      if (!cvs) return;
      const ctx = cvs.getContext("2d");
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      // Draw grid guidelines
      ctx.strokeStyle = "#E2E8F0";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(140, 0); ctx.lineTo(140, 280);
      ctx.moveTo(0, 140); ctx.lineTo(280, 140);
      ctx.stroke();
      if (state.showWriteGuide) {
        ctx.fillStyle = "rgba(203, 213, 225, 0.48)";
        ctx.font = "bold 180px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(state.writeChar, 140, 148);
      }
      let drawing = false;
      ctx.strokeStyle = "#1B365D";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      const pos = (e) => {
        const r = cvs.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - r.left, y: clientY - r.top };
      };
      cvs.onpointerdown = (e) => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
      cvs.onpointermove = (e) => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
      cvs.onpointerup = () => { drawing = false; };
    }

    function renderNumberCategories() {
      const cat = DATA.numbersCategories.find(c => c.id === state.selectedNumCat) || DATA.numbersCategories[0];
      return `
        <div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;">
          ${DATA.numbersCategories.map(c => {
            const title = (c.i18nTitle && c.i18nTitle[state.lang]) || c.title;
            return `<button class="sub-tab ${c.id === cat.id ? 'active' : ''}" onclick="state.selectedNumCat='${c.id}';renderContent()">${title}</button>`;
          }).join("")}
        </div>
        <div class="grid-cards">
          ${cat.items.map((item, idx) => {
            const itemId = `${cat.id}_${idx}`;
            const sysBadge = (DATA.numSystemI18n && DATA.numSystemI18n[item.system] && DATA.numSystemI18n[item.system][state.lang]) || item.system;
            return `
              <div class="card">
                <div class="card-header">
                  <div>
                    <span class="badge">${item.num} · ${sysBadge}</span>
                    <div class="hangul-lg">${item.korean}</div>
                  </div>
                  ${item.irregular ? `<span class="badge review">⚠️ Irregular</span>` : ''}
                </div>
                ${renderPronLayers({
                  hangul: item.korean, romaji: item.romaji,
                  nativePronMap: item.nativePron,
                  actualPron: item.actualPron,
                  translation: item.exampleKr ? `${item.exampleKr} (${item.exampleZh})` : item.note,
                  note: item.note
                })}
                ${renderAudioAndSrsRow(item.korean, itemId)}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderCounters() {
      const cnt = DATA.counters.find(c => c.id === state.selectedCounter) || DATA.counters[0];
      const cntTitle = (cnt.i18nName && cnt.i18nName[state.lang]) || cnt.name;
      return `
        <div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;">
          ${DATA.counters.map(c => {
            const nm = (c.i18nName && c.i18nName[state.lang]) || c.name;
            return `<button class="sub-tab ${c.id === cnt.id ? 'active' : ''}" onclick="state.selectedCounter='${c.id}';renderContent()">${c.korean} (${c.romaji})</button>`;
          }).join("")}
        </div>
        <div class="card" style="margin-bottom:14px;">
          <div class="hangul-md">${cntTitle}</div>
          ${renderPronLayers({
            hangul: cnt.korean, romaji: cnt.romaji,
            nativePronMap: cnt.nativePron,
            actualPron: `[${cnt.korean}]`,
            translation: cnt.numberSystem,
            note: cnt.ruleNote
          })}
          ${renderAudioAndSrsRow(cnt.korean, cnt.id)}
        </div>
        <div class="grid-cards">
          ${cnt.countTable.map((row, idx) => `
            <div class="card">
              <div class="card-header">
                <span class="badge ${row.irr ? 'review' : ''}">${row.n} ${row.irr ? '⚠️' : ''}</span>
                <span class="hangul-md">${row.k}</span>
              </div>
              ${renderPronLayers({
                hangul: row.k, romaji: row.r,
                nativePronMap: row.nativePron,
                actualPron: row.actual,
                translation: row.n
              })}
              ${renderAudioAndSrsRow(row.k, cnt.id + "_" + idx)}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderNumComparison() {
      return `<div class="grid-cards">` + DATA.numberSystemComparison.map(nc => `
        <div class="card">
          <div class="hangul-md">${nc.situation}</div>
          <div class="badge">${nc.system}</div>
          <div style="font-weight:700;color:var(--primary);">${nc.example}</div>
          <div style="font-size:0.83rem;color:var(--text-muted);">${nc.note}</div>
        </div>
      `).join("") + `</div>`;
    }

    function renderConversations() {
      const conv = DATA.conversations.find(c => c.id === state.selectedConv) || DATA.conversations[0];
      const title = (conv.i18nTitle && conv.i18nTitle[state.lang]) || conv.title;
      return `
        <div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;">
          ${DATA.conversations.map(c => {
            const ct = (c.i18nTitle && c.i18nTitle[state.lang]) || c.title;
            return `<button class="sub-tab ${c.id === conv.id ? 'active' : ''}" onclick="state.selectedConv='${c.id}';renderContent()">#${c.order} ${ct.split('(')[0]}</button>`;
          }).join("")}
        </div>
        <div class="card" style="margin-bottom:14px;">
          <div class="hangul-md">${title}</div>
          <div style="font-size:0.85rem;color:var(--text-muted);">${conv.situation}</div>
          ${state.toggles.pronNotes ? `<div style="font-size:0.82rem;background:var(--surface-alt);padding:8px;border-radius:8px;">📌 ${conv.grammarNote}</div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${conv.lines.map(line => {
            const spk = (DATA.speakerI18n && DATA.speakerI18n[line.speaker] && DATA.speakerI18n[line.speaker][state.lang]) || line.speaker;
            const trText = (line.i18n && line.i18n[state.lang]) || line.zh;
            return `
              <div class="card">
                <div class="card-header">
                  <span class="badge">${spk}</span>
                  <span style="font-size:0.75rem;color:var(--text-muted);">${line.id}</span>
                </div>
                <div class="hangul-md">${line.kr}</div>
                ${renderPronLayers({
                  hangul: line.kr, romaji: line.romaji,
                  nativePronMap: line.nativePron,
                  actualPron: line.actual,
                  translation: trText,
                  note: line.note
                })}
                ${renderAudioAndSrsRow(line.kr, line.id)}
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderQuiz() {
      const pool = state.quizMode === "weak" && state.progress.wrongQuizIds.length > 0
        ? DATA.quizQuestions.filter(q => state.progress.wrongQuizIds.includes(q.id))
        : DATA.quizQuestions;
      if (state.quizIdx >= pool.length) state.quizIdx = 0;
      const q = pool[state.quizIdx];
      const promptText = (q.i18nPrompt && q.i18nPrompt[state.lang]) || q.prompt;
      const optionsList = (q.i18nOptions && q.i18nOptions[state.lang]) || q.options;

      return `
        <div class="combiner-box">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
            <div>
              <button class="preset-btn ${state.quizMode==='all'?'active':''}" onclick="state.quizMode='all';state.quizIdx=0;state.quizSubmitted=false;renderContent()">${t("quizStartAll")}</button>
              <button class="preset-btn ${state.quizMode==='weak'?'active':''}" onclick="state.quizMode='weak';state.quizIdx=0;state.quizSubmitted=false;renderContent()">${t("quizStartWeak")} (${state.progress.wrongQuizIds.length})</button>
            </div>
            <span class="badge">Question ${state.quizIdx + 1} / ${pool.length} · ${q.id.toUpperCase()}</span>
          </div>
          <div style="font-size:1.08rem;font-weight:800;margin-bottom:10px;">${promptText}</div>
          <div style="display:flex;align-items:center;gap:14px;background:var(--surface-alt);padding:14px;border-radius:12px;margin-bottom:14px;">
            <div class="hangul-lg">${q.targetDisplay}</div>
            <button class="btn-audio" onclick="speakKorean('${q.targetAudio}')">🔊 ${t("btnListen")}</button>
          </div>
          <div>
            ${optionsList.map((opt, idx) => {
              let cls = "quiz-option";
              if (state.quizSubmitted) {
                if (idx === q.correctIndex) cls += " correct";
                else if (idx === state.quizSelected) cls += " wrong";
              } else if (idx === state.quizSelected) {
                cls += " active";
              }
              return `<button class="${cls}" onclick="selectQuizOption(${idx}, ${q.correctIndex}, '${q.id}')">${idx + 1}. ${opt}</button>`;
            }).join("")}
          </div>
          ${state.quizSubmitted ? `
            <div style="margin-top:12px;padding:12px;border-radius:10px;background:#F8FAFC;border:1px solid var(--border);">
              <div style="font-weight:800;margin-bottom:4px;">${state.quizSelected === q.correctIndex ? t("quizCorrect") : t("quizWrong")}</div>
              <div style="font-size:0.86rem;color:var(--text-muted);">${q.explanation}</div>
              <button class="btn-audio" style="margin-top:10px;" onclick="state.quizIdx=(state.quizIdx+1)%${pool.length};state.quizSubmitted=false;state.quizSelected=null;renderContent()">${t("quizNext")}</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function selectQuizOption(idx, correctIdx, qid) {
      if (state.quizSubmitted) return;
      state.quizSelected = idx;
      state.quizSubmitted = true;
      state.progress.quizTotal = (state.progress.quizTotal || 0) + 1;
      if (idx === correctIdx) {
        state.progress.quizCorrect = (state.progress.quizCorrect || 0) + 1;
        state.progress.wrongQuizIds = state.progress.wrongQuizIds.filter(x => x !== qid);
      } else {
        if (!state.progress.wrongQuizIds.includes(qid)) state.progress.wrongQuizIds.push(qid);
        state.progress.itemStatus[qid] = "review";
      }
      saveState();
      renderContent();
    }

    function renderStats() {
      const statuses = Object.values(state.progress.itemStatus);
      const masteredCount = statuses.filter(s => s === "mastered").length;
      const reviewCount = statuses.filter(s => s === "review").length + state.progress.wrongQuizIds.length;
      const totalRevs = Object.values(state.progress.reviewCounts).reduce((a, b) => a + b, 0);
      const acc = state.progress.quizTotal > 0
        ? Math.round((state.progress.quizCorrect / state.progress.quizTotal) * 100) + "%"
        : "— (0/0)";

      return `
        <div class="grid-cards" style="margin-bottom:16px;">
          <div class="card"><div class="badge mastered">${t("statsTotalMastered")}</div><div class="hangul-lg">${masteredCount}</div></div>
          <div class="card"><div class="badge">${t("statsQuizAccuracy")}</div><div class="hangul-lg">${acc}</div></div>
          <div class="card"><div class="badge review">${t("statsReviewQueue")}</div><div class="hangul-lg">${reviewCount}</div></div>
          <div class="card"><div class="badge">${t("statsTotalReviews")}</div><div class="hangul-lg">${totalRevs}</div></div>
        </div>
        <div class="card">
          <div style="font-size:0.86rem;color:var(--text-muted);margin-bottom:10px;">🔒 ${t("privacyNotice")}</div>
          <button class="preset-btn" onclick="localStorage.removeItem('${STORAGE_KEY}');location.reload();">${t("btnResetProgress")}</button>
        </div>
      `;
    }

    function renderAll() {
      initLangDropdown();
      syncToggleCheckboxes();
      renderHeaderAndNav();
      renderContent();
    }

    loadState();
    renderAll();
  </script>
</body>
</html>
